name: OpenInference Java documentation

on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/docs/integrations/import/openinference.mdx
      - scripts/openinference-java-*
      - .github/workflows/openinference-java-docs.yml

permissions:
  contents: read

jobs:
  native-annotations:
    name: Native annotations (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the documentation contract
        run: node --test scripts/openinference-java-page.test.mjs
      - name: Prepare released floor and current dependencies
        run: |
          python -m venv "$RUNNER_TEMP/oi-venv"
          "$RUNNER_TEMP/oi-venv/bin/python" -I -m pip install opentelemetry-proto==1.38.0
          "$RUNNER_TEMP/oi-venv/bin/python" -I scripts/openinference-java-wire.py \
            --work "$RUNNER_TEMP/oi-wire" --java-home "$JAVA_HOME" --prepare
      - name: Execute documentation and annotation contracts with loopback networking only
        run: |
          sudo --preserve-env=JAVA_HOME,RUNNER_TEMP env PATH="$PATH" unshare --net sh -ec '
            ip link set lo up
            "$RUNNER_TEMP/oi-venv/bin/python" -I scripts/openinference-java-wire.py \
              --work "$RUNNER_TEMP/oi-wire" --java-home "$JAVA_HOME"
          '
