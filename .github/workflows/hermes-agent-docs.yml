name: Hermes Agent CLI installation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/docs/integrations/coding-agents/hermes-agent.mdx'
      - 'examples/coding-agents/hermes-agent/**'
      - 'scripts/hermes-agent-page.test.mjs'
      - '.github/workflows/hermes-agent-docs.yml'

permissions:
  contents: read

jobs:
  install:
    name: Hermes released install (${{ matrix.route }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        route: [pip, directory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the guide's Hermes CLI version in an isolated environment
        env:
          INSTALL_ROUTE: ${{ matrix.route }}
        run: |
          git clone --depth 1 --branch v2026.9.24 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-source"
          python -m venv "$RUNNER_TEMP/hermes-venv"
          if [ "$INSTALL_ROUTE" = directory ]; then
            # Managed Hermes uses uv.lock; its plugin installer also honors these
            # core constraints. Do not mix that route with pip's floating core.
            python -m pip install uv
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/hermes-venv" \
              UV_PYTHON="$RUNNER_TEMP/hermes-venv/bin/python" \
              uv sync --project "$RUNNER_TEMP/hermes-source" --locked --no-dev --inexact
          else
            "$RUNNER_TEMP/hermes-venv/bin/python" -m pip install -e "$RUNNER_TEMP/hermes-source"
          fi
          echo "$RUNNER_TEMP/hermes-venv/bin" >> "$GITHUB_PATH"
      - name: Install the published plugin through the selected route
        env:
          HOME: ${{ runner.temp }}/hermes-user
          HERMES_HOME: ${{ runner.temp }}/hermes-user/hermes-home
          INSTALL_ROUTE: ${{ matrix.route }}
        run: |
          mkdir -p "$HERMES_HOME"
          if [ "$INSTALL_ROUTE" = pip ]; then
            python -m pip install 'traceAI-hermes-agent==0.1.1'
          else
            hermes plugins install future-agi/traceAI/python/frameworks/hermes-agent/hermes-plugin/futureagi < /dev/null
          fi
          python -I examples/coding-agents/hermes-agent/check_install.py
      - name: Enable the plugin and verify hook registration without credentials
        env:
          HOME: ${{ runner.temp }}/hermes-user
          HERMES_HOME: ${{ runner.temp }}/hermes-user/hermes-home
          INSTALL_ROUTE: ${{ matrix.route }}
        run: |
          hermes plugins enable futureagi < /dev/null
          hermes plugins list
          python -I examples/coding-agents/hermes-agent/check_install.py --enabled
          python -m pip check
