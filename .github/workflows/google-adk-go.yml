name: Google ADK Go native tracing

on:
  pull_request:
    paths:
      - '.github/workflows/google-adk-go.yml'
      - 'examples/google-adk-go/**'
      - 'scripts/google-adk-go.test.mjs'
      - 'src/pages/docs/integrations/traceai/go/google-adk.mdx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-otlp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - name: Check the customer snippets match the executable examples
        run: node --test scripts/google-adk-go.test.mjs
      - name: Install pinned published dependencies and Collector
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/examples/google-adk-go"
          python -m venv "$root/venv"
          "$root/venv/bin/pip" install -r "$root/requirements.txt"
          mkdir -p "$root/downloads/collector-0.164.0"
          archive="$root/downloads/collector-0.164.0/collector.tar.gz"
          curl --fail --location --retry 2 https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.164.0/otelcol-contrib_0.164.0_linux_amd64.tar.gz -o "$archive"
          echo "f0c1ce9f661399beb4a58b711924716e08ea70c3802db0715fcfde3cbbada2d4  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$root/downloads/collector-0.164.0"
          for major in 1 2; do
            if [ "$major" = 1 ]; then version=1.25.0; else version=1.26.6; fi
            for module in "v$major" "customer-v$major"; do
              GOTOOLCHAIN="go$version" go -C "$root/tests/$module" mod download
              GOTOOLCHAIN="go$version" go -C "$root/tests/$module" build -mod=readonly -o "$root/tests/$module/probe" .
            done
          done
      - name: Execute native spans and customer examples with localhost-only networking
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/examples/google-adk-go"
          # A fresh network namespace has no external interfaces or routes.
          # Dependency installation is complete before entering this namespace.
          sudo unshare --net bash -c '
            set -euo pipefail
            ip link set lo up
            root="$1"
            export FI_API_KEY=synthetic-api-key FI_SECRET_KEY=synthetic-secret-key
            "$root/downloads/collector-0.164.0/otelcol-contrib" validate --config="$root/collector.yaml"
            "$root/venv/bin/python" -I "$root/tests/acceptance.py"
            "$root/venv/bin/python" -I "$root/tests/customer_acceptance.py"
          ' bash "$root"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-adk-go-native-evidence
          path: examples/google-adk-go/evidence
          if-no-files-found: ignore
