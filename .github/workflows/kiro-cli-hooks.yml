name: Kiro CLI hook contracts

on:
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/kiro-cli-hooks.yml'
      - 'examples/coding-agents/hook-to-otlp/**'
      - 'examples/coding-agents/kiro-cli/**'
      - 'src/pages/docs/integrations/coding-agents/kiro-cli.mdx'
      - 'scripts/kiro-cli-page.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook-contracts:
    name: Kiro CLI adapter and installer contracts
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exercise hook guards, privacy, session resume and installation scopes
        working-directory: examples/coding-agents/hook-to-otlp
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -t . -p 'test_kiro_cli*.py' -v
