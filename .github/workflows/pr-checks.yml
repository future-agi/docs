name: PR Checks

on:
  pull_request:
    branches: [dev, main]

jobs:
  link-audit:
    name: Link audit & redirect enforcement
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git diff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Nothing below installs dependencies or needs secrets, so this job also
      # runs on fork PRs, which never receive repo secrets

      # Resolves the install without writing node_modules; fails when
      # package.json changed but package-lock.json was not regenerated
      - name: Check package-lock.json is in sync
        run: npm ci --dry-run --ignore-scripts

      - name: Check integration catalog, logos, navigation parity and public wording
        run: npm run test:integrations

      - name: Check broken nav & content links
        run: node scripts/audit-links.mjs

      - name: Check deleted pages have redirects
        run: node scripts/check-deleted-pages.mjs ${{ github.base_ref }}

  test_helicone_conformance:
    name: Helicone offline conformance (Python ${{ matrix.python }}, OpenAI ${{ matrix.py_openai }}, TS ${{ matrix.ts_openai }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            py_openai: '1.69.0'
            ts_openai: '4.0.0'
          - python: '3.13'
            py_openai: '3.42.1'
            ts_openai: '7.47.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install published Python integrations and selected OpenAI release
        working-directory: examples/gateways/helicone
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'openai==${{ matrix.py_openai }}'
      - name: Install published TypeScript integrations and selected OpenAI release
        working-directory: examples/gateways/helicone/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund 'openai@${{ matrix.ts_openai }}'
          test "$(node -p "require('./node_modules/openai/package.json').version")" = '${{ matrix.ts_openai }}'
      - name: Run loopback gateway and OTLP contract tests (no external services)
        working-directory: examples/gateways/helicone
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest tests -q

  docs-build:
    name: Docs build & Pagefind
    # Playwright 1.56.1 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:integrations
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exercise the built integration directory
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/docs-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          npm run test:integrations:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrations-browser
          path: /tmp/docs-integrations-browser
          if-no-files-found: ignore
