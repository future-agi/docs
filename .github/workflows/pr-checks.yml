name: PR Checks

on:
  pull_request:
    branches: [dev, main]

jobs:
  link-audit:
    name: Link audit & redirect enforcement
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git diff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The audit scripts use only Node built-ins: no install, no secrets,
      # so this job also runs on fork PRs, which never receive repo secrets
      - name: Check broken nav & content links
        run: node scripts/audit-links.mjs

      - name: Check deleted pages have redirects
        run: node scripts/check-deleted-pages.mjs ${{ github.base_ref }}

  changelog-transform-test:
    name: Release-notes generator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Guards the release-notes generator that changelog-sync.yml runs on every
      # platform-release dispatch. Node built-ins only: no install, no secrets.
      - name: Run changelog transform tests
        run: node --test scripts/changelog-from-release.test.mjs
