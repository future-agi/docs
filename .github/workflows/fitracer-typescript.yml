name: FITracer TypeScript guide

on:
  pull_request:
    paths:
      - src/pages/docs/sdk/tracing/fitracer.mdx
      - examples/sdk/fitracer-typescript/**
      - .github/workflows/fitracer-typescript.yml

permissions:
  contents: read

jobs:
  snippet:
    name: FITracer snippet (OTel ${{ matrix.otel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otel: ['2.0.1', '2.12.0']
    defaults:
      run:
        working-directory: examples/sdk/fitracer-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install current locked dependencies
        if: matrix.otel == '2.12.0'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the supported OpenTelemetry floor
        if: matrix.otel == '2.0.1'
        run: |
          npm pkg set 'devDependencies.@opentelemetry/context-async-hooks=2.0.1'
          npm pkg set 'overrides.@opentelemetry/context-async-hooks=2.0.1' \
            'overrides.@opentelemetry/core=2.0.1' \
            'overrides.@opentelemetry/resources=2.0.1' \
            'overrides.@opentelemetry/sdk-trace-base=2.0.1' \
            'overrides.@opentelemetry/sdk-trace-node=2.0.1'
          npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check and execute the guide with loopback-only networking
        run: sudo env "PATH=$PATH" unshare --net sh -c 'ip link set lo up; npm test'
