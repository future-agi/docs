name: Temporal Go native tracing

on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/frameworks/temporal-go/**'
      - 'src/pages/docs/integrations/frameworks/temporal-go.mdx'
      - 'src/lib/integrations.mjs'
      - 'scripts/integrations.test.mjs'
      - '.github/workflows/temporal-go-native.yml'

permissions:
  contents: read

jobs:
  otlp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.25.4'
            sdk: 'v1.46.0'
          - go: '1.26.0'
            sdk: 'v1.50.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: examples/frameworks/temporal-go/go.sum
      - name: Test released SDK against loopback OTLP receiver
        working-directory: examples/frameworks/temporal-go
        run: |
          go mod edit -go=${{ matrix.go }} -require=go.temporal.io/sdk@${{ matrix.sdk }}
          go mod tidy
          go test -race ./...
