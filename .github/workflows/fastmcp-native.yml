name: FastMCP native examples

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/docs/integrations/frameworks/fastmcp.mdx'
      - 'scripts/test_fastmcp_native.py'
      - 'scripts/fastmcp-page.test.mjs'
      - 'src/lib/integrations.mjs'
      - '.github/workflows/fastmcp-native.yml'

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            fastmcp: '4.1.0'
          - python: '3.13'
            fastmcp: '4.1.4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install published packages
        run: python -m pip install "fastmcp==${{ matrix.fastmcp }}" opentelemetry-sdk opentelemetry-exporter-otlp-proto-http pytest
      - name: Check native guide discovery and wording
        run: node --test scripts/fastmcp-page.test.mjs
      - name: Run real snippets with loopback networking only
        run: |
          PYTHON=$(command -v python)
          sudo unshare --net bash -c 'ip link set lo up; exec "$1" -I -m pytest --noconftest -q "$2"' -- "$PYTHON" "$PWD/scripts/test_fastmcp_native.py"
