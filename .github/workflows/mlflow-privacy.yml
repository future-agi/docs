name: MLflow native OTLP privacy

on:
  pull_request:
    paths:
      - 'src/pages/docs/integrations/mlflow.mdx'
      - 'examples/mlflow/**'
      - '.github/workflows/mlflow-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mlflow: ['3.16.1', '3.17.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r examples/mlflow/requirements-test.txt "mlflow==${{ matrix.mlflow }}"
      - name: Download released Collector Contrib
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/mlflow-collector"
          cd "$RUNNER_TEMP/mlflow-collector"
          archive=otelcol-contrib_0.164.0_linux_amd64.tar.gz
          url=https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.164.0
          curl -fLsS "$url/$archive" -o "$archive"
          curl -fLsS "$url/$archive.sha256" -o "$archive.sha256"
          printf '%s  %s\n' "$(cat "$archive.sha256")" "$archive" | sha256sum --check
          tar -xzf "$archive" otelcol-contrib
      - name: Run wire tests with only loopback networking
        shell: bash
        run: |
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec env OTELCOL_CONTRIB="$1" "$2" -I -m pytest "$3" -q --noconftest
          ' bash "$RUNNER_TEMP/mlflow-collector/otelcol-contrib" "$PWD/.venv/bin/python" "$PWD/examples/mlflow/tests/test_privacy.py"
