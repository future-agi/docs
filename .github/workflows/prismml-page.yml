name: PrismML page contracts

on:
  pull_request:
    paths:
      - 'src/pages/docs/integrations/providers/prismml.mdx'
      - 'scripts/test_prismml_page.py'
      - 'scripts/prismml-page.test.mjs'
      - '.github/workflows/prismml-page.yml'

permissions:
  contents: read

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            openai: '1.69.0'
          - python: '3.13'
            openai: '3.42.1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install published dependencies
        run: python -m pip install 'openai==${{ matrix.openai }}' 'traceAI-openai==0.1.12' 'fi-instrumentation-otel==1.2.2' pytest
      - name: Check dependency consistency
        run: python -m pip check
      - name: Execute the exact guide with loopback model and OTLP servers
        run: python -m pytest scripts/test_prismml_page.py -q
