name: Anthropic Go docs

on:
  pull_request:
    paths:
      - 'src/pages/docs/integrations/traceai/go/anthropic.mdx'
      - 'scripts/anthropic-go-*.mjs'
      - '.github/workflows/anthropic-go-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snippet:
    name: Anthropic Go 1.26 snippet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Check page contract
        run: node --test scripts/anthropic-go-page.test.mjs
      - name: Extract exact page commands and Go snippet
        run: node scripts/anthropic-go-snippet.mjs "$RUNNER_TEMP/anthropic-go-snippet"
      - name: Install and compile without provider credentials
        working-directory: ${{ runner.temp }}/anthropic-go-snippet
        env:
          GOTOOLCHAIN: local
        run: |
          bash install.sh
          go build -o example .
          go vet ./...
          go test -race github.com/future-agi/traceAI/go/anthropic
