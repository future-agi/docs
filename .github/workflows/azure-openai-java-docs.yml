name: Azure OpenAI Java documentation

on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/docs/integrations/traceai/java/llm-providers.mdx
      - scripts/azure-openai-java*
      - .github/workflows/azure-openai-java-docs.yml

permissions:
  contents: read

jobs:
  otlp-contract:
    name: Azure OTLP contract (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install OTLP decoder
        run: python -m pip install opentelemetry-proto==1.38.0
      - name: Run exact Maven and Gradle examples with synthetic Azure and captured OTLP
        run: python -I scripts/azure-openai-java-wire.py --work "$RUNNER_TEMP/azure-java"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-java-${{ matrix.java }}
          path: ${{ runner.temp }}/azure-java/evidence
          if-no-files-found: error
