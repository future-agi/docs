name: FITracer Java guide

on:
  pull_request:
    paths:
      - src/pages/docs/sdk/tracing/fitracer.mdx
      - examples/sdk/fitracer-java/**
      - .github/workflows/fitracer-java.yml

permissions:
  contents: read

jobs:
  snippet:
    name: FITracer Java snippet (released SDK 1.0.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/sdk/fitracer-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the OTLP decoder
        run: python -I -m pip install -r requirements-test.txt
      - name: Extract and compile both snippets against Maven Central
        run: python -I snippet_test.py --compile-only
      - name: Execute the guide with loopback-only networking
        run: sudo env "PATH=$PATH" unshare --net sh -c 'ip link set lo up; python -I snippet_test.py --run-only'
