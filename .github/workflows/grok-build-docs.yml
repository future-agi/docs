name: Grok Build hook contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'examples/coding-agents/hook-to-otlp/**'
      - 'examples/coding-agents/grok-build/**'
      - 'src/pages/docs/integrations/coding-agents/grok-build.mdx'
      - '.github/workflows/grok-build-docs.yml'

permissions:
  contents: read

jobs:
  hooks:
    name: Grok hook contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9'
          - os: macos-26
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise Grok adapter, installer and guarded hook commands
        working-directory: examples/coding-agents/hook-to-otlp
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_grok_build_adapter tests.test_grok_build_hooks_config -v
