name: Foundry native tracing

on:
  pull_request:
    paths:
      - src/pages/docs/integrations/frameworks/azure-ai-foundry.mdx
      - examples/frameworks/azure-ai-foundry/**
      - .github/workflows/foundry-native.yml

permissions:
  contents: read

jobs:
  offline-tracing:
    name: Native tracing (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: minimum 2.10.0
            projects: '==2.10.0'
          - name: latest 2.x
            projects: '>=2.10.0,<3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install guide dependencies
        run: >-
          python -m pip install
          'azure-ai-projects${{ matrix.projects }}'
          'azure-core-tracing-opentelemetry==1.0.0b13'
          'fi-instrumentation-otel==1.2.2'
      - name: Check guide imports before adding test dependencies
        run: |
          python -m pip check
          python -I - <<'PY'
          from azure.ai.projects import AIProjectClient
          from azure.ai.projects.models import PromptAgentDefinition
          from azure.ai.projects.telemetry import AIProjectInstrumentor
          from azure.identity import DefaultAzureCredential
          from fi_instrumentation import register
          from fi_instrumentation.fi_types import ProjectType
          PY
      - name: Install test dependencies
        run: |
          python -m pip install 'traceAI-openai==0.1.11' pytest
          python -m pip check
      - name: Download collector
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/foundry-collector"
          cd "$RUNNER_TEMP/foundry-collector"
          asset=otelcol-contrib_0.162.0_linux_amd64.tar.gz
          base=https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.162.0
          curl -fSL "$base/$asset" -o "$asset"
          curl -fSL "$base/$asset.sha256" -o "$asset.sha256"
          printf '%s  %s\n' "$(cat "$asset.sha256")" "$asset" | sha256sum -c -
          tar -xzf "$asset" otelcol-contrib
      - name: Exercise guide with outbound networking disabled
        shell: bash
        run: |
          python=$(command -v python)
          sudo unshare --net sh -c 'ip link set lo up; exec "$@"' sh \
            env OTELCOL_BINARY="$RUNNER_TEMP/foundry-collector/otelcol-contrib" \
            "$python" -I -m pytest examples/frameworks/azure-ai-foundry/test_native.py \
            -q -p no:cacheprovider
