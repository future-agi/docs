name: Auggie session hooks

on:
  pull_request:
    paths:
      - 'examples/coding-agents/augment-code/**'
      - 'examples/coding-agents/hook-to-otlp/**'
      - 'src/pages/docs/integrations/coding-agents/augment-code.mdx'
      - 'scripts/augment-code-page.test.mjs'
      - '.github/workflows/augment-hooks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-hooks:
    name: Auggie hook contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-26
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise the adapter, session-only installer and quiet wrapper
        working-directory: examples/coding-agents/hook-to-otlp
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: python -m unittest tests.test_augment_adapter tests.test_augment_hooks_config -v
