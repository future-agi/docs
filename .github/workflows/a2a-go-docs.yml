name: A2A Go documentation

on:
  pull_request:
    branches: [main, dev]
    paths:
      - src/pages/docs/integrations/traceai/go/a2a.mdx
      - examples/traceai/a2a-go/**
      - .github/workflows/a2a-go-docs.yml

permissions:
  contents: read

jobs:
  example:
    name: A2A Go example & page contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Check page snippets, wrapper APIs and version pins
        run: python3 -I -m unittest discover -s examples/traceai/a2a-go/tests -v
      - name: Build the documented application and run loopback wire tests
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          cp examples/traceai/a2a-go/*.go "$WORK/"
          cd "$WORK"
          go mod init example.com/a2a-go-example
          go get github.com/future-agi/traceAI/go/a2a@v0.1.1 github.com/a2aproject/a2a-go/v2@v2.7.0
          go get go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0
          go mod tidy
          go build -o a2a-go-example .
          go test -race -count=1 -v ./...
