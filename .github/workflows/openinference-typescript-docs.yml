name: OpenInference TypeScript documentation

on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/docs/integrations/import/openinference.mdx
      - scripts/openinference-typescript-page.test.mjs
      - examples/import/openinference-typescript/**
      - .github/workflows/openinference-typescript-docs.yml

permissions:
  contents: read

jobs:
  native-typescript:
    name: Native TypeScript (${{ matrix.versions }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.15.0', '24']
        versions: [floor, current]
    defaults:
      run:
        working-directory: examples/import/openinference-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install released dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install declared floors
        if: matrix.versions == 'floor'
        run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false @arizeai/openinference-core@2.8.0 typescript@5.9.3
      - name: Execute the documented snippet with loopback networking only
        run: |
          sudo env PATH="$PATH" unshare --net sh -ec '
            ip link set lo up
            npm test
          '
