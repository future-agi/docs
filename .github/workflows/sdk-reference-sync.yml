# Refreshes the platform SDK reference (src/pages/docs/sdk/reference) from the SDK
# repository's generated pages and opens a PR against main. Run it by hand for a given SDK
# ref, let the SDK repository dispatch it on a release, or rely on the weekly run.
name: sdk-reference-sync

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: futureagi-sdk ref to sync from (branch, tag or SHA)
        default: dev
  repository_dispatch:
    types: [sdk-release]   # client_payload.ref: the SDK ref to sync from
  schedule:
    - cron: '0 6 * * 1'    # Mondays 06:00 UTC, from the SDK's dev branch

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # App token (not GITHUB_TOKEN): the org forbids Actions from creating PRs
      # with GITHUB_TOKEN, and App-minted tokens are exempt. Scoped to this repo.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Resolve the SDK ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.sdk_ref }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
        run: echo "ref=${INPUT_REF:-${DISPATCH_REF:-dev}}" >> "$GITHUB_OUTPUT"
      - name: Check out the generated reference from the SDK repository
        uses: actions/checkout@v4
        with:
          repository: future-agi/futureagi-sdk
          ref: ${{ steps.ref.outputs.ref }}
          path: .sdk
          sparse-checkout: docs/sdk-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync the pages and the sidebar group
        run: node scripts/sync-sdk-reference.mjs --from .sdk
      - name: Check nav and content links
        run: node scripts/audit-links.mjs
      - name: Open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -eu
          if git diff --quiet -- src/pages/docs/sdk/reference src/lib/sdk-reference.mjs; then
            echo "reference already current"; exit 0
          fi
          sha=$(git -C .sdk rev-parse --short HEAD)
          branch="chore/sdk-reference-${sha}"
          git config user.name "futureagi-release-bot"
          git config user.email "release-bot@futureagi.com"
          git switch -c "$branch"
          git add src/pages/docs/sdk/reference src/lib/sdk-reference.mjs
          git commit -m "docs(sdk): sync the platform SDK reference from futureagi-sdk@${sha}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs(sdk): platform SDK reference from futureagi-sdk@${sha}" \
            --body "Generated pages from [future-agi/futureagi-sdk@${sha}](https://github.com/future-agi/futureagi-sdk/tree/${sha}/docs/sdk-reference) (ref \`${SDK_REF}\`), copied by \`scripts/sync-sdk-reference.mjs\`. Do not edit the pages here: fix the generator in the SDK repository and re-run the sync."
