name: TrueFoundry client example

on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/gateways/truefoundry/**'
      - 'src/pages/docs/integrations/gateways/truefoundry.mdx'
      - '.github/workflows/truefoundry-client.yml'

permissions:
  contents: read

jobs:
  client:
    name: TrueFoundry client (OpenAI ${{ matrix.openai }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openai: ['1.69.0', '3.42.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install released client packages
        run: >-
          python -m pip install
          'traceai-openai==0.1.11' 'fi-instrumentation-otel==1.2.2'
          'openai==${{ matrix.openai }}' 'pytest==9.1.1' 'pyyaml==6.0.3'
      - name: Test examples and exact page snippet
        # conftest blocks non-loopback DNS and connections; all credentials are synthetic.
        run: python -I -m pytest examples/gateways/truefoundry/tests -q
