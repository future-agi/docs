name: Ragas evaluation recipe

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/docs/integrations/frameworks/ragas.mdx'
      - 'scripts/test_ragas_recipe.py'
      - '.github/workflows/ragas-recipe.yml'

permissions:
  contents: read

jobs:
  recipe:
    name: Ragas ${{ matrix.ragas }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            ragas: '0.4.0'
          - python: '3.13'
            ragas: '0.4.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install released recipe dependencies
        run: >-
          python -m pip install
          'ragas==${{ matrix.ragas }}'
          'langchain-community==0.4.1' 'futureagi==0.6.13'
      - name: Execute the exact page snippet
        # The test denies non-loopback sockets and uses only synthetic credentials.
        run: python -I scripts/test_ragas_recipe.py -v
