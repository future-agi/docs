name: Zero-code Node docs

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/pages/docs/integrations/traceai/auto.mdx'
      - 'scripts/auto-*.mjs'
      - '.github/workflows/auto-node-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-snippets:
    name: Published npm snippets (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.6.0', '22.18.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Audit public reference links and heading anchors
        run: node scripts/auto-links.mjs
      - name: Run every guide snippet with loopback provider and OTLP
        run: node scripts/auto-snippets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-snippets-${{ matrix.node }}
          path: /tmp/docs-auto-evidence
          if-no-files-found: error
