name: Gemini Go documentation

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'examples/traceai/gemini-go/**'
      - 'src/pages/docs/integrations/traceai/go/gemini.mdx'
      - 'scripts/gemini-go-page.test.mjs'
      - '.github/workflows/gemini-go-docs.yml'

permissions:
  contents: read

jobs:
  privacy-contract:
    name: Gemini Go privacy (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ['v1.71.0', 'v1.75.0']
    defaults:
      run:
        working-directory: examples/traceai/gemini-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install the released integration and supported SDK
        run: |
          go mod init example.com/gemini-go-example
          go get github.com/future-agi/traceAI/go/genai@v0.1.1 google.golang.org/genai@${{ matrix.sdk }}
          go get go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0
          go mod tidy
      - name: Check formatting and exercise exported privacy behavior
        env:
          GOPROXY: 'off'
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          test -z "$(gofmt -l main.go main_test.go)"
          go test -race -count=1 -v ./...
