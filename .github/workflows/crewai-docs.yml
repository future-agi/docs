name: CrewAI native tracing documentation

on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/docs/integrations/traceai/crewai.mdx
      - scripts/crewai-*.test.*
      - scripts/crewai-ingestion-check/**
      - .github/workflows/crewai-docs.yml

permissions:
  contents: read

jobs:
  native-tracing:
    name: Native tracing (Python ${{ matrix.python }}, CrewAI ${{ matrix.crewai }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        crewai: ['==1.15.33', '>=1.15.33,<2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install published native dependencies
        run: python -m pip install 'crewai${{ matrix.crewai }}' opentelemetry-exporter-otlp-proto-http 'pytest>=8,<10'
      - name: Download the documented Collector Contrib release
        run: |
          mkdir -p "$RUNNER_TEMP/crewai-collector"
          cd "$RUNNER_TEMP/crewai-collector"
          ASSET=otelcol-contrib_0.164.0_linux_amd64.tar.gz
          URL=https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.164.0
          curl --fail --location --retry 3 "$URL/$ASSET" -o "$ASSET"
          curl --fail --location --retry 3 "$URL/$ASSET.sha256" -o "$ASSET.sha256"
          printf '%s  %s\n' "$(cat "$ASSET.sha256")" "$ASSET" | sha256sum --check
          tar -xzf "$ASSET" otelcol-contrib
          echo "CREWAI_COLLECTOR=$RUNNER_TEMP/crewai-collector/otelcol-contrib" >> "$GITHUB_ENV"
      - name: Check out the production ingestion contract
        uses: actions/checkout@v4
        with:
          repository: future-agi/future-agi
          ref: ee01c07fd6d7e9b1805944883350b2d0064c2b42
          path: .test-deps/future-agi
          sparse-checkout: fi-collector
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .test-deps/future-agi/fi-collector/go.mod
          cache-dependency-path: .test-deps/future-agi/fi-collector/go.sum
      - name: Build the real production converter adapter
        working-directory: .test-deps/future-agi/fi-collector
        run: |
          go build -o "$RUNNER_TEMP/crewai-ingestion-check" "$GITHUB_WORKSPACE/scripts/crewai-ingestion-check/main.go"
          echo "CREWAI_INGESTION_CHECK=$RUNNER_TEMP/crewai-ingestion-check" >> "$GITHUB_ENV"
      - name: Check page contracts
        run: node --test scripts/crewai-page.test.mjs
      - name: Run native snippets through Collector and production ingestion offline
        run: |
          TEST_PYTHON="$(command -v python)"
          TEST_HOME="$(mktemp -d)"
          sudo env TEST_PYTHON="$TEST_PYTHON" TEST_HOME="$TEST_HOME" \
            CREWAI_COLLECTOR="$CREWAI_COLLECTOR" CREWAI_INGESTION_CHECK="$CREWAI_INGESTION_CHECK" \
            unshare --net sh -c 'ip link set lo up; env -i PATH=/usr/bin:/bin HOME="$TEST_HOME" CREWAI_COLLECTOR="$CREWAI_COLLECTOR" CREWAI_INGESTION_CHECK="$CREWAI_INGESTION_CHECK" "$TEST_PYTHON" -I -m pytest --noconftest --import-mode=importlib -q scripts/crewai-native.test.py'
