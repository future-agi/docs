name: CrewAI native tracing documentation

on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/docs/integrations/traceai/crewai.mdx
      - scripts/crewai-*.test.*
      - .github/workflows/crewai-docs.yml

permissions:
  contents: read

jobs:
  native-tracing:
    name: Native tracing (Python ${{ matrix.python }}, CrewAI ${{ matrix.crewai }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        crewai: ['==1.15.33', '>=1.15.33,<2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install published native dependencies
        run: python -m pip install 'crewai${{ matrix.crewai }}' opentelemetry-exporter-otlp-proto-http 'pytest>=8,<10'
      - name: Check page contracts
        run: node --test scripts/crewai-page.test.mjs
      - name: Run native snippets with loopback networking only
        run: |
          TEST_PYTHON="$(command -v python)"
          TEST_HOME="$(mktemp -d)"
          sudo env TEST_PYTHON="$TEST_PYTHON" TEST_HOME="$TEST_HOME" \
            unshare --net sh -c 'ip link set lo up; env -i PATH=/usr/bin:/bin HOME="$TEST_HOME" "$TEST_PYTHON" -I -m pytest --noconftest --import-mode=importlib -q scripts/crewai-native.test.py'
