name: RubyLLM documentation

on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/docs/integrations/frameworks/ruby-llm.mdx
      - scripts/ruby-llm-*.test.*
      - examples/frameworks/ruby-llm/**
      - .github/workflows/ruby-llm-docs.yml

permissions:
  contents: read

jobs:
  native-tracing:
    name: Native tracing (Ruby ${{ matrix.ruby }}, RubyLLM ${{ matrix.ruby_llm }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.4']
        ruby_llm: ['2.1.0', '2.1.1']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install published framework and exporter gems
        run: >-
          gem install --no-document ruby_llm:${{ matrix.ruby_llm }}
          opentelemetry-sdk:1.10.0 opentelemetry-exporter-otlp:0.32.0
          webrick:1.9.1 minitest:5.25.5
      - name: Check the native and legacy page contracts
        run: node --test scripts/ruby-llm-page.test.mjs
      - name: Run the snippets with only loopback networking
        # A private network namespace blocks provider/OTLP egress, even on regressions.
        run: |
          sudo --preserve-env=GEM_HOME,GEM_PATH env PATH="$PATH" \
            RUBY_LLM_VERSION="${{ matrix.ruby_llm }}" \
            unshare --net sh -c 'ip link set lo up; ruby scripts/ruby-llm-native.test.rb'

  legacy-privacy:
    name: Legacy privacy (Ruby ${{ matrix.ruby }}, RubyLLM ${{ matrix.ruby_llm }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.4']
        ruby_llm: ['1.15.0', '1.16.0']
    env:
      RUBY_LLM_VERSION: ${{ matrix.ruby_llm }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/examples/frameworks/ruby-llm/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install legacy fixture dependencies
        run: bundle install
      - name: Run privacy and wire regressions without external networking
        working-directory: examples/frameworks/ruby-llm
        run: |
          sudo --preserve-env=GEM_HOME,GEM_PATH,BUNDLE_GEMFILE,RUBY_LLM_VERSION env PATH="$PATH" \
            unshare --net sh -c 'ip link set lo up; bundle exec rake test'
