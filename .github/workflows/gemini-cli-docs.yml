name: Gemini CLI collector privacy

on:
  pull_request:
    paths:
      - 'src/pages/docs/integrations/coding-agents/gemini-cli.mdx'
      - 'examples/coding-agents/gemini-cli/**'
      - 'scripts/gemini-cli-page.test.mjs'
      - '.github/workflows/gemini-cli-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-privacy:
    name: Gemini CLI collector privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download released Collector Contrib
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/gemini-collector"
          cd "$RUNNER_TEMP/gemini-collector"
          archive=otelcol-contrib_0.162.0_linux_amd64.tar.gz
          curl -fLsS "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.162.0/$archive" -o "$archive"
          echo "fcc063749f730f8c21fe29f2d340ff174f5f1c5885bd3156fb6c985a3036fcc3  $archive" | sha256sum --check
          tar -xzf "$archive" otelcol-contrib
          test -x otelcol-contrib
      - name: Check default and opt-in exports with loopback-only networking
        shell: bash
        run: |
          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec env OTELCOL_BIN="$1" "$2" -I -m unittest discover -s "$3" -v
          ' bash "$RUNNER_TEMP/gemini-collector/otelcol-contrib" "$(command -v python)" "$PWD/examples/coding-agents/gemini-cli/tests"
