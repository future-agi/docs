name: Python MCP native tracing documentation

on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/docs/integrations/traceai/mcp-python.mdx
      - src/pages/docs/integrations/traceai/mcp.mdx
      - scripts/mcp-python-native.test.py
      - .github/workflows/mcp-python-docs.yml

permissions:
  contents: read

jobs:
  native-tracing:
    name: Native MCP (Python ${{ matrix.python }}, MCP ${{ matrix.mcp }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        mcp: ['==2.3.0', '>=2.3.0,<3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install published native dependencies
        run: python -m pip install 'mcp${{ matrix.mcp }}' opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
      - name: Run exact snippets and lifecycle checks with loopback networking only
        run: |
          TEST_PYTHON="$(command -v python)"
          TEST_HOME="$(mktemp -d)"
          sudo env TEST_PYTHON="$TEST_PYTHON" TEST_HOME="$TEST_HOME" \
            unshare --net sh -c 'ip link set lo up; env -i PATH=/usr/bin:/bin HOME="$TEST_HOME" "$TEST_PYTHON" -I scripts/mcp-python-native.test.py -v'
