name: EverOS native tracing

on:
  pull_request:
    paths:
      - '.github/workflows/everos-native.yml'
      - 'public/examples/observe/langfuse-native.yaml'
      - 'examples/integrations/everos/**'
      - 'src/pages/docs/integrations/traceai/everos.mdx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        everos: ['1.4.2', '1.5.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native tracing dependencies only
        run: |
          python -m pip install --no-deps 'everos==${{ matrix.everos }}'
          python -m pip install opentelemetry-exporter-otlp-proto-http==1.38.0 structlog==25.5.0 pydantic-settings==2.11.0 pyyaml==6.0.3
      - name: Install pinned Collector Contrib
        run: |
          mkdir -p "$RUNNER_TEMP/everos-collector"
          cd "$RUNNER_TEMP/everos-collector"
          ARCHIVE=otelcol-contrib_0.164.0_linux_amd64.tar.gz
          URL=https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.164.0
          curl -fSLO "$URL/$ARCHIVE"
          curl -fSLO "$URL/$ARCHIVE.sha256"
          printf '%s  %s\n' "$(cat "$ARCHIVE.sha256")" "$ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE"
      - name: Exercise real native export with loopback-only networking
        run: |
          sudo unshare --net -- bash -c '
            set -eu
            ip link set lo up
            exec env -i PATH=/usr/bin:/bin HOME="$4" OTELCOL="$1" "$2" -I "$3"
          ' -- "$RUNNER_TEMP/everos-collector/otelcol-contrib" "$(command -v python)" "$GITHUB_WORKSPACE/examples/integrations/everos/test_collector.py" "$RUNNER_TEMP"
