name: Vercel platform documentation

on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/docs/integrations/runtimes/vercel.mdx
      - examples/runtimes/vercel-platform/**
      - .github/workflows/vercel-platform-docs.yml

permissions:
  contents: read

jobs:
  native-platform:
    name: Native Next.js (${{ matrix.versions }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        versions: [floor, current, latest]
    defaults:
      run:
        working-directory: examples/runtimes/vercel-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install released dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install declared floors for isolated compatibility testing
        if: matrix.versions == 'floor'
        run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false @vercel/otel@2.0.0 next@16.0.0
      - name: Install moving latest releases
        if: matrix.versions == 'latest'
        run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false @vercel/otel@latest @opentelemetry/api@latest next@latest react@latest react-dom@latest
      - name: Execute documented code with loopback networking only
        run: |
          sudo env PATH="$PATH" unshare --net sh -ec '
            ip link set lo up
            npm test
          '
