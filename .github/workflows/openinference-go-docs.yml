name: OpenInference Go documentation

on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/docs/integrations/import/openinference.mdx
      - examples/import/openinference-go/**
      - scripts/crewai-ingestion-check/**
      - .github/workflows/openinference-go-docs.yml

permissions:
  contents: read

jobs:
  native-tracing:
    name: Native Go tracing (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - dependencies: floor
            go: '1.25.0'
            modfile: go.mod
          - dependencies: latest
            go: '1.26.0'
            modfile: latest.mod
    steps:
      - uses: actions/checkout@v4
      - name: Check out the production ingestion contract
        uses: actions/checkout@v4
        with:
          repository: future-agi/future-agi
          ref: 814b6c4e745e754dc2eeb43a4d238d318adc4daa
          path: .test-deps/future-agi
          sparse-checkout: fi-collector
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            examples/import/openinference-go/*.sum
            .test-deps/future-agi/fi-collector/go.sum
      - name: Resolve released dependencies before denying outbound networking
        run: |
          (cd .test-deps/future-agi/fi-collector && go mod download)
          (cd examples/import/openinference-go && go mod download -modfile=${{ matrix.modfile }})
      - name: Run exact guide, wire and production conversion tests on loopback only
        env:
          MODFILE: ${{ matrix.modfile }}
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
        run: |
          export INGESTION_CHECK="$RUNNER_TEMP/openinference-ingestion-check"
          sudo --preserve-env=MODFILE,INGESTION_CHECK,GOTOOLCHAIN,GOPROXY,GOSUMDB,GOWORK env PATH="$PATH" HOME="$HOME" \
            unshare --net sh -ec '
              ip link set lo up
              ROOT="$PWD"
              (cd .test-deps/future-agi/fi-collector && go build -o "$INGESTION_CHECK" "$ROOT/scripts/crewai-ingestion-check/main.go")
              cd examples/import/openinference-go
              export GOFLAGS="-modfile=$MODFILE -mod=readonly"
              go test -race -count=1 -v ./...
            '
