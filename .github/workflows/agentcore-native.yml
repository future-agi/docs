name: AgentCore released tracing

on:
  pull_request:
    paths:
      - 'examples/traceai/bedrock-agentcore/**'
      - 'src/pages/docs/integrations/traceai/bedrock-agentcore.mdx'
      - '.github/workflows/agentcore-native.yml'

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r examples/traceai/bedrock-agentcore/requirements-test.txt
      - name: Run current examples and deployment contract
        run: >-
          python -m pytest -q
          examples/traceai/bedrock-agentcore/tests/test_native.py
          examples/traceai/bedrock-agentcore/tests/test_deploy_contract.py
          --junitxml=agentcore-native.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentcore-native-${{ matrix.python }}
          path: agentcore-native.xml

  historical-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/traceai/bedrock-agentcore/tests/legacy/requirements-test.txt
      - name: Preserve the old release regression suite separately
        run: >-
          python -m pytest -q examples/traceai/bedrock-agentcore/tests/legacy/tests
          --junitxml=agentcore-historical.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentcore-historical
          path: agentcore-historical.xml
