name: OpenAI-compatible provider pages

on:
  pull_request:
    paths:
      - 'src/pages/docs/integrations/providers/cometapi.mdx'
      - 'src/pages/docs/integrations/providers/z-ai.mdx'
      - 'examples/providers/cometapi/**'
      - 'examples/providers/z-ai/**'
      - '.github/workflows/compatible-provider-pages.yml'

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [cometapi, z-ai]
        suite: [documented-page, legacy-example]
    defaults:
      run:
        working-directory: examples/providers/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the page's pinned releases
        if: matrix.suite == 'documented-page'
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python -I - <<'PY'
          import os, re, shlex, subprocess, sys
          from pathlib import Path
          page = Path('../../../src/pages/docs/integrations/providers') / (os.environ['PROVIDER'] + '.mdx')
          (pins,) = re.findall(r'^python -m pip install (.+)$', page.read_text(), re.MULTILINE)
          requirements = shlex.split(pins)
          if [pin.split('==')[0] for pin in requirements] != ['traceAI-openai', 'fi-instrumentation-otel', 'openai'] or not all(re.fullmatch(r'[\w-]+==\d+\.\d+\.\d+', pin) for pin in requirements):
              raise ValueError('Expected the three exact release pins from the page')
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'pytest', *requirements], check=True)
          PY
      - name: Install the legacy example's pinned releases
        if: matrix.suite == 'legacy-example'
        run: python -m pip install -r requirements.txt
      - name: Install the native Z.ai client for the compatibility check
        if: matrix.provider == 'z-ai' && matrix.suite == 'legacy-example'
        run: python -m pip install -r requirements.txt 'zai-sdk==0.2.3'
      - name: Run with loopback networking only
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          target=tests
          if [ "$SUITE" = documented-page ]; then target=tests/test_page.py; fi
          sudo unshare --net sh -ec 'ip link set lo up; exec "$@"' sh \
            "$(command -v python)" -m pytest -q "$target"
