name: Vitest native OpenTelemetry

on:
  pull_request:
    paths:
      - 'examples/frameworks/vitest/**'
      - '.github/workflows/vitest-native.yml'
  push:
    branches: [main]
    paths:
      - 'examples/frameworks/vitest/**'
      - '.github/workflows/vitest-native.yml'

jobs:
  otlp-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vitest: ['5.0.5', 'latest']
    defaults:
      run:
        working-directory: examples/frameworks/vitest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Vitest and standard OpenTelemetry packages
        run: npm install --no-save --ignore-scripts --no-audit --no-fund "vitest@${{ matrix.vitest }}" @opentelemetry/api @opentelemetry/sdk-node @opentelemetry/resources @opentelemetry/exporter-trace-otlp-http
      - name: Check native OTLP export to loopback receiver
        run: npm run test:contract
