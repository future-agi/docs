name: Workers AI REST example

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'examples/runtimes/cloudflare-workers-ai/**'
      - 'src/pages/docs/integrations/runtimes/cloudflare-workers-ai.mdx'
      - '.github/workflows/cloudflare-workers-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Workers AI conformance (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20.6.0', '22.18.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - name: Install published tracing package
        working-directory: examples/runtimes/cloudflare-workers-ai
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check REST capture, privacy, failure and page parity without provider credentials
        working-directory: examples/runtimes/cloudflare-workers-ai
        run: npm test
