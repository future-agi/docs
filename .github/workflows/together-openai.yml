name: Together OpenAI recipe

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/docs/integrations/traceai/togetherai.mdx'
      - 'examples/providers/together-openai/**'
      - '.github/workflows/together-openai.yml'

permissions:
  contents: read

jobs:
  recipe:
    name: Published recipe (${{ matrix.scenario }}, Python ${{ matrix.python }}, OpenAI ${{ matrix.openai }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scenario: fresh, python: '3.10', openai: '1.69.0'}
          - {scenario: fresh, python: '3.10', openai: '3.42.0'}
          - {scenario: fresh, python: '3.13', openai: '3.42.0'}
          - {scenario: upgrade, python: '3.13', openai: '1.69.0'}
          - {scenario: upgrade, python: '3.13', openai: '3.42.0'}
          - {scenario: downgrade, python: '3.13', openai: '1.69.0'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install test dependencies and both HTTP packages
        run: python -m pip install 'pytest>=8,<10' 'httpx==0.28.1' 'httpx2>=2.12,<3'
      - name: Seed an existing traceAI installation
        if: matrix.scenario == 'upgrade'
        run: python -m pip install 'traceAI-openai==0.1.10' 'fi-instrumentation-otel==0.1.15' 'openai==${{ matrix.openai }}'
      - name: Seed the current OpenAI SDK before downgrading
        if: matrix.scenario == 'downgrade'
        run: python -m pip install 'openai==3.42.0'
      - name: Select the OpenAI version and released instrumentor
        run: |
          python -m pip install 'openai==${{ matrix.openai }}'
          # Do not constrain the core: only the guide should trigger its upgrade.
          printf 'openai==${{ matrix.openai }}\ntraceAI-openai==0.1.11\n' > "$RUNNER_TEMP/together-constraints.txt"
      - name: Install or upgrade using the exact guide command
        env:
          PIP_CONSTRAINT: '${{ runner.temp }}/together-constraints.txt'
        run: |
          python -I examples/providers/together-openai/install_from_guide.py
          python -m pip check
      - name: Run with loopback-only networking
        run: |
          sudo unshare --net sh -c 'ip link set lo up; exec "$@"' sh \
            "$(command -v python)" -I -m pytest -q \
            --confcutdir=examples/providers/together-openai \
            examples/providers/together-openai/test_recipe.py
