name: Together OpenAI recipe

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/docs/integrations/traceai/togetherai.mdx'
      - 'examples/providers/together-openai/**'
      - '.github/workflows/together-openai.yml'

permissions:
  contents: read

jobs:
  recipe:
    name: Published recipe (${{ matrix.scenario }}, Python ${{ matrix.python }}, OpenAI ${{ matrix.openai }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scenario: fresh, python: '3.13', openai: resolver}
          - {scenario: fresh, python: '3.10', openai: '1.69.0'}
          - {scenario: fresh, python: '3.10', openai: '1.109.1'}
          - {scenario: fresh, python: '3.13', openai: '1.109.1'}
          - {scenario: upgrade, python: '3.13', seed_openai: '1.69.0', openai: '1.69.0'}
          - {scenario: upgrade, python: '3.13', seed_openai: '3.42.0', openai: '1.109.1'}
          - {scenario: downgrade, python: '3.13', seed_openai: '3.42.0', openai: '1.69.0'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Seed the older instrumentor and core for the upgrade case
        if: matrix.scenario == 'upgrade'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'traceAI-openai==0.1.10' 'fi-instrumentation-otel==0.1.15' 'openai==${{ matrix.seed_openai }}'
      - name: Seed only the newer SDK for the downgrade case
        if: matrix.scenario == 'downgrade'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'openai==${{ matrix.seed_openai }}'
      - name: Install using the published setup block
        run: |
          # Select a test point inside the published OpenAI 1.x range. Only the
          # guide installs/upgrades the adapter and core, including in seeded venvs.
          if [ "${{ matrix.openai }}" != resolver ]; then
            printf 'openai==${{ matrix.openai }}\n' > "$RUNNER_TEMP/together-constraints.txt"
            export PIP_CONSTRAINT="$RUNNER_TEMP/together-constraints.txt"
          fi
          python -I examples/providers/together-openai/install_from_guide.py
          if [ "${{ matrix.openai }}" != resolver ]; then
            .venv/bin/python -c 'from importlib.metadata import version; assert version("openai") == "${{ matrix.openai }}"'
          fi
      - name: Install test dependencies alongside both HTTP packages
        run: |
          .venv/bin/python -m pip install 'pytest>=8,<10' 'httpx2>=2.12,<3'
          .venv/bin/python -m pip check
      - name: Run with loopback-only networking
        run: |
          sudo unshare --net sh -c 'ip link set lo up; exec "$@"' sh \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs \
            "$PWD/.venv/bin/python" -I -m pytest -q \
            --confcutdir=examples/providers/together-openai \
            examples/providers/together-openai/test_recipe.py
