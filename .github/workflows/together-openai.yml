name: Together OpenAI recipe

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/docs/integrations/traceai/togetherai.mdx'
      - 'examples/providers/together-openai/**'
      - '.github/workflows/together-openai.yml'

permissions:
  contents: read

jobs:
  recipe:
    name: Published recipe (OpenAI ${{ matrix.openai }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openai: ['1.69.0', '3.42.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install released packages
        run: python -m pip install 'traceAI-openai==0.1.11' 'fi-instrumentation-otel==1.2.2' 'openai==${{ matrix.openai }}' 'pytest>=8,<10'
      - name: Run with loopback-only networking
        run: |
          sudo unshare --net sh -c 'ip link set lo up; exec "$@"' sh \
            "$(command -v python)" -I -m pytest -q \
            --confcutdir=examples/providers/together-openai \
            examples/providers/together-openai/test_recipe.py
