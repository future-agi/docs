# LiteLLM Proxy config for Future AGI tracing (OTEL v1 callback).
#
# Everything that points at Future AGI lives in environment variables (see env.example),
# so this file never holds a key. The upstream here is the local mock; to use a real
# provider, change UPSTREAM_API_BASE / UPSTREAM_API_KEY / UPSTREAM_MODEL in the environment.
model_list:
  - model_name: demo-model                       # the name callers send to the proxy
    litellm_params:
      model: os.environ/UPSTREAM_MODEL           # e.g. openai/mock-model
      api_base: os.environ/UPSTREAM_API_BASE     # e.g. http://127.0.0.1:18081/v1
      api_key: os.environ/UPSTREAM_API_KEY

  - model_name: unreachable-model                # an upstream that refuses connections (error demo)
    litellm_params:
      model: openai/unreachable
      api_base: http://127.0.0.1:9/v1
      api_key: sk-unused

litellm_settings:
  callbacks: ["otel"]                            # the proxy's OpenTelemetry callback

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY      # must start with sk-
