# OpenTelemetry Collector (contrib) that sits between LiteLLM Proxy and Future AGI and removes
# what LiteLLM exports even when message content is off: provider error text, Python stack traces
# (they contain file paths of the proxy host), the caller's address and user agent, and the
# upstream host. Tested with otel/opentelemetry-collector-contrib 0.162.0.
#
# Environment: FI_TRACES_ENDPOINT (for example http://host:4318/v1/traces), FI_API_KEY, FI_SECRET_KEY.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/scrub:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # provider error text and stack traces
          - delete_key(attributes, "error.message")
          - delete_key(attributes, "litellm.provider.error.stack_trace")
          - set(status.message, "") where status.code == STATUS_CODE_ERROR
          # who called the proxy, and which upstream host it called
          - delete_key(attributes, "net.peer.ip")
          - delete_key(attributes, "net.peer.port")
          - delete_key(attributes, "http.user_agent")
          - delete_key(attributes, "http.host")
          - delete_key(attributes, "http.server_name")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "server.address")
          - delete_key(attributes, "server.port")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  batch:
    timeout: 2s

exporters:
  otlphttp/futureagi:
    traces_endpoint: ${env:FI_TRACES_ENDPOINT}
    headers:
      X-Api-Key: ${env:FI_API_KEY}
      X-Secret-Key: ${env:FI_SECRET_KEY}
    compression: none
    encoding: proto

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/scrub, batch]
      exporters: [otlphttp/futureagi]
