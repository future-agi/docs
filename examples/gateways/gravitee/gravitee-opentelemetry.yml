# Gravitee APIM Gateway -> OpenTelemetry Collector (otelcol.yaml) -> Future AGI. Traces only.
# Merge this under the top-level `services:` key of the Gateway's gravitee.yml
# (Helm: under `gateway.services:` in values.yaml). Tested on graviteeio/apim-gateway:4.12.23.
#
# The Collector hop is required today: Future AGI needs the resource attribute `project_name`,
# and Gravitee rewrites every `_` in an extraAttributes key to `.` (it exports `project.name`).
# otelcol.yaml sets `project_name` and holds the Future AGI keys.
#
# The Collector token is NOT in this file. Set it as environment variables on the Gateway
# (Gravitee sends a ${...} placeholder in an exporter header value literally, it does not resolve it):
#   gravitee_services_opentelemetry_exporter_headers_0_name=Authorization
#   gravitee_services_opentelemetry_exporter_headers_0_value=Bearer <GATEWAY_TOKEN>
# Any key below can be overridden the same way, e.g. gravitee_services_opentelemetry_verbose=true.
services:
  opentelemetry:
    enabled: true
    # false = no span events with request/response headers or context attributes.
    # true is the opt-in, and it also needs Verbose on the API (Reporter settings). See the page.
    verbose: false
    exporter:
      # Base URL only. With http/protobuf Gravitee appends /v1/traces itself.
      endpoint: http://otel-collector:4318
      protocol: http/protobuf          # not grpc (the default); "http/json" is unknown and falls back to grpc
      compression: none                # the Future AGI receiver rejects gzip bodies
    # Masked inside the Gateway before export (first matching rule wins).
    redactionRules:
      # The Gateway node's own container hostname and IP, sent as resource attributes.
      - attributeNamePattern: hostname
        maskingStrategy:
          type: FULL
      - attributeNamePattern: ip
        maskingStrategy:
          type: FULL
      # Full URLs carry the query string (tokens, emails). Masked only when there is one.
      - attributeNamePattern: http.target
        valuePattern: "\\?"
        maskingStrategy:
          type: FULL
      - attributeNamePattern: http.url
        valuePattern: "\\?"
        maskingStrategy:
          type: FULL
      - attributeNamePattern: url.query
        maskingStrategy:
          type: FULL
      - attributeNamePattern: original-url     # verbose: gravitee.attribute.request.original-url
        valuePattern: "\\?"
        maskingStrategy:
          type: FULL
      # The caller's IP (root span) and, in verbose mode, the keyless plan's user id (also the caller's IP).
      - attributeNamePattern: client.address
        maskingStrategy:
          type: FULL
      - attributeNamePattern: user-id
        maskingStrategy:
          type: FULL
      # Backend errors: keep the error status and gravitee.execution-failure.key, drop the raw text.
      - attributeNamePattern: exception.message
        maskingStrategy:
          type: FULL
      - attributeNamePattern: exception.stacktrace
        maskingStrategy:
          type: FULL
      # Only reached in verbose mode, where request/response headers become span event attributes.
      # A short name (no dot) matches the last segment of any key, e.g. ...header.authorization.
      - attributeNamePattern: authorization
        maskingStrategy:
          type: FULL
      - attributeNamePattern: proxy-authorization
        maskingStrategy:
          type: FULL
      - attributeNamePattern: cookie
        maskingStrategy:
          type: FULL
      - attributeNamePattern: set-cookie
        maskingStrategy:
          type: FULL
      - attributeNamePattern: x-gravitee-api-key
        maskingStrategy:
          type: FULL
      - attributeNamePattern: x-api-key
        maskingStrategy:
          type: FULL
      - attributeNamePattern: x-secret-key
        maskingStrategy:
          type: FULL
