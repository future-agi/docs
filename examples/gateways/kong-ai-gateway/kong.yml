_format_version: "3.0"

# Kong declarative config (DB-less). Replace the ${...} placeholders, or render
# this file with `envsubst` (see run_e2e.sh). Tested on kong/kong-gateway 3.16.0.1.
services:
  - name: llm
    # ai-proxy decides the real upstream; this URL is only a placeholder.
    url: http://localhost:32000
    routes:
      - name: chat
        protocols: [http, https]
        paths: [/chat]
    plugins:
      - name: ai-proxy
        config:
          route_type: llm/v1/chat
          auth:
            header_name: Authorization
            header_value: "Bearer ${UPSTREAM_API_KEY}"
          model:
            provider: openai
            name: ${UPSTREAM_MODEL}
            options:
              upstream_url: ${UPSTREAM_CHAT_URL}
          logging:
            log_statistics: true              # model + token counts on the span
            log_payloads: ${LOG_PAYLOADS}     # false = no prompts/completions in spans

plugins:
  - name: opentelemetry
    config:
      traces_endpoint: ${FI_TRACES_ENDPOINT}  # e.g. https://api.futureagi.com/tracer/v1/traces
      headers:
        X-Api-Key: "${FI_API_KEY}"
        X-Secret-Key: "${FI_SECRET_KEY}"
      resource_attributes:
        project_name: ${FI_PROJECT_NAME}      # must exist in the key's workspace
        project_type: observe
      sampling_rate: 1
      propagation:
        extract: [w3c]
        inject: [w3c]
        default_format: w3c
