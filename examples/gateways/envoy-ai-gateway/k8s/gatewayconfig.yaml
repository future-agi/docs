# NOT RUN ON A CLUSTER. Per-gateway config, apiVersion v1beta1 (v1alpha1 is gone). Env is standard Kubernetes
# EnvVar, so keys can come from a Secret and be composed with $(VAR) expansion (earlier entries first).
#   kubectl create secret generic futureagi-keys -n default --from-literal=api-key=... --from-literal=secret-key=...
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: futureagi-tracing
  namespace: default
spec:
  extProc:
    kubernetes:
      env:
        - name: FI_API_KEY
          valueFrom: { secretKeyRef: { name: futureagi-keys, key: api-key } }
        - name: FI_SECRET_KEY
          valueFrom: { secretKeyRef: { name: futureagi-keys, key: secret-key } }
        - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "https://api.futureagi.com/tracer" }
        - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
        - { name: OTEL_EXPORTER_OTLP_HEADERS,  value: "X-Api-Key=$(FI_API_KEY),X-Secret-Key=$(FI_SECRET_KEY)" }
        - { name: OTEL_RESOURCE_ATTRIBUTES,    value: "project_name=envoy-ai-gateway,project_type=observe" }
        - { name: OTEL_METRICS_EXPORTER,       value: "none" }
        - { name: OTEL_SERVICE_NAME,           value: "ai-gateway-production" }
        - { name: OPENINFERENCE_HIDE_INPUTS,   value: "true" }
        - { name: OPENINFERENCE_HIDE_OUTPUTS,  value: "true" }
        - { name: OPENINFERENCE_HIDE_EMBEDDINGS_TEXT,    value: "true" }
        - { name: OPENINFERENCE_HIDE_EMBEDDINGS_VECTORS, value: "true" }
---
# Attach it to a Gateway with the annotation:
#   metadata.annotations: { aigateway.envoyproxy.io/gateway-config: futureagi-tracing }
