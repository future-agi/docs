# NOT RUN ON A CLUSTER. Checked against chart v1.2.0 by `helm template` and by reading the controller source:
# the chart joins extProc.extraEnvVars with ";" and passes them to every ext-proc container (plain name/value only,
# no valueFrom, so the keys appear in the controller Deployment args - prefer gatewayconfig.yaml for secrets).
#   helm upgrade --install aieg oci://docker.io/envoyproxy/ai-gateway-helm --version v1.2.0 \
#     -n envoy-ai-gateway-system --create-namespace -f helm-values.yaml
extProc:
  extraEnvVars:
    - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "https://api.futureagi.com/tracer" }   # self-hosted: http://<collector>:4318
    - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
    - { name: OTEL_EXPORTER_OTLP_HEADERS,  value: "X-Api-Key=REPLACE,X-Secret-Key=REPLACE" }
    - { name: OTEL_RESOURCE_ATTRIBUTES,    value: "project_name=envoy-ai-gateway,project_type=observe" }
    - { name: OTEL_METRICS_EXPORTER,       value: "none" }
    - { name: OPENINFERENCE_HIDE_INPUTS,   value: "true" }
    - { name: OPENINFERENCE_HIDE_OUTPUTS,  value: "true" }
    - { name: OPENINFERENCE_HIDE_EMBEDDINGS_TEXT,    value: "true" }
    - { name: OPENINFERENCE_HIDE_EMBEDDINGS_VECTORS, value: "true" }
controller:
  # default is already agent-session-id:session.id for spans; shown for clarity
  spanRequestHeaderAttributes: "agent-session-id:session.id"
