# OpenTelemetry Collector Contrib 0.164.0. Run on the application host.
# Raw content reaches this loopback receiver; only filtered traces leave it.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  filter/privacy:
    error_mode: propagate
    trace_conditions:
      - context: span
        conditions:
          # Link payloads cannot be cleared by this transform configuration.
          - Len(span.links) > 0
      - context: spanevent
        conditions: ['true']
  transform/privacy:
    # A failed transformation rejects the payload; never continue unfiltered.
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, [])
          - set(resource.attributes["project_name"], "${env:FI_PROJECT_NAME}")
          - set(resource.attributes["project_type"], "observe")
          - set(resource.attributes["service.name"], "${env:FI_PROJECT_NAME}")
      - context: scope
        statements:
          - keep_keys(scope.attributes, [])
          - set(scope.name, "mlflow")
          - set(scope.version, "")
      - context: span
        statements:
          - keep_keys(span.attributes, ["gen_ai.operation.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.provider.name", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens"])
          - delete_key(span.attributes, "gen_ai.operation.name") where span.attributes["gen_ai.operation.name"] != nil and not IsMatch(span.attributes["gen_ai.operation.name"], "^(chat|text_completion|generate_content|embeddings|execute_tool|invoke_agent|CHAIN|RETRIEVER|RERANKER|GUARDRAIL|EVALUATOR|UNKNOWN)$$")
          - set(span.name, "mlflow")
          - set(span.name, span.attributes["gen_ai.operation.name"]) where span.attributes["gen_ai.operation.name"] != nil
          - set(span.status.message, "")
          - set(span.trace_state, "")
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp_http/futureagi:
    traces_endpoint: ${env:FI_TRACES_ENDPOINT}
    headers:
      x-api-key: ${env:FI_API_KEY}
      x-secret-key: ${env:FI_SECRET_KEY}
    compression: none

service:
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/privacy, transform/privacy, batch]
      exporters: [otlp_http/futureagi]
