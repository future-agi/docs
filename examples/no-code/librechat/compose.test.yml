# Smallest LibreChat stack for the recipe test run: MongoDB, the LibreChat API image (it also serves the
# web UI) and the Future AGI collector. run_e2e.sh renders $RUN_DIR/librechat.env and $RUN_DIR/librechat.yaml
# and starts this file. Not a production deployment: use LibreChat's own docker-compose.yml plus
# docker-compose.override.yml.example for that.
services:
  mongodb:
    image: mongo:${MONGO_TAG:-8.0.20}
    command: ["mongod", "--noauth", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 384m

  api:
    image: registry.librechat.ai/librechat-ai/librechat-api:${LIBRECHAT_VERSION:-v0.8.8}
    depends_on:
      - mongodb
      - futureagi-otelcol
    ports:
      - "127.0.0.1:${LIBRECHAT_PORT:-13080}:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${RUN_DIR:?set RUN_DIR}/librechat.env
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - ${RUN_DIR}/librechat.yaml:/app/librechat.yaml:ro
      - ./mcp:/mcp:ro
    mem_limit: 768m

  futureagi-otelcol:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.162.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./otelcol/otelcol.yaml:/etc/otelcol/config.yaml:ro
    environment:
      - FI_TRACES_URL=${FI_TRACES_URL:?set FI_TRACES_URL}
      - FI_PROJECT_NAME=${FI_PROJECT_NAME:?set FI_PROJECT_NAME}
      - FI_CAPTURE_CONTENT=${FI_CAPTURE_CONTENT:-false}
    mem_limit: 192m
