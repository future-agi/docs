# LibreChat config used by the Future AGI recipe test run (LibreChat v0.8.8).
# Nothing in this file is needed for tracing: tracing is configured with environment variables only.
# It gives the test run a model behind any OpenAI-compatible endpoint and one MCP tool server.
version: 1.3.17
cache: true

mcpServers:
  order-tools:
    type: stdio
    command: node
    args:
      - /mcp/order_tools.mjs
    timeout: 30000

endpoints:
  custom:
    - name: 'TestModels'
      apiKey: '${TEST_LLM_API_KEY}'
      baseURL: '${TEST_LLM_BASE_URL}'
      # LibreChat disables streamed usage for custom endpoints unless explicitly requested.
      # The test upstream must support OpenAI's stream_options.include_usage (OpenAI does).
      addParams:
        streamUsage: true
      models:
        # The second model does not exist upstream; the test run uses it for the failure case.
        default: ['${TEST_LLM_MODEL}', 'th8234-missing-model']
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'Test models'
