# Example only: any omp model works with the hook. This is the shape of the
# OpenAI-compatible model entry used for the end-to-end test (run there against
# a local gateway). Put it in ~/.omp/agent/models.yml and export
# MY_GATEWAY_API_KEY; omp reads `apiKey` as an environment variable name.
# Then: OMP_MODEL=my-gateway/gpt-6-luna ./run_e2e.sh
providers:
  my-gateway:
    baseUrl: https://llm-gateway.example.com/v1
    apiKey: MY_GATEWAY_API_KEY
    api: openai-completions
    models:
      - id: gpt-6-luna
        name: GPT-6 Luna (gateway)
        contextWindow: 200000
        maxTokens: 16384
