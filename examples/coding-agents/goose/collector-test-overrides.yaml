# Test-only overlay for otel-collector.yaml: write forwarded traces to a file
# instead of sending them to Future AGI. Everything else, including
# service.telemetry, comes from the shipped config.
exporters:
  file/test:
    path: ${env:TEST_OUT}
    flush_interval: 100ms
processors:
  batch:
    timeout: 100ms
service:
  pipelines:
    traces:
      exporters: [file/test]
