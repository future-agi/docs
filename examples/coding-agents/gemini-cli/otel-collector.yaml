# OpenTelemetry Collector between Gemini CLI and Future AGI.
#
# Gemini CLI exports OTLP traces, logs and metrics to this collector. The
# collector keeps the traces, removes prompt-shaped attributes, labels the span
# kinds Future AGI shows, and forwards the traces with your Future AGI keys.
# Logs and metrics are dropped: the Future AGI collector accepts traces only.
#
#   FI_API_KEY=... FI_SECRET_KEY=... otelcol-contrib --config otel-collector.yaml
#
# Environment:
#   FI_API_KEY, FI_SECRET_KEY  required
#   FI_BASE_URL                default https://api.futureagi.com (traces go to $FI_BASE_URL/tracer/v1/traces)
#   FI_PROJECT_NAME            default gemini-cli
#   GEMINI_OTLP_LISTEN         default 127.0.0.1:4318 (Gemini CLI's otlpEndpoint must match)
#
# The collector's own metrics endpoint (port 8888) is turned off at the end of
# this file, so it does not collide with Jupyter or another collector.

receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:GEMINI_OTLP_LISTEN:-127.0.0.1:4318}

processors:
  transform/gemini-cli:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["project_name"], "${env:FI_PROJECT_NAME:-gemini-cli}")
          # Node's default resource detectors record the full command line
          # (for `gemini -p "..."` it contains the prompt), local paths, the
          # OS user name and the machine name. Keep only runtime and arch.
          - delete_key(attributes, "process.command_args")
          - delete_key(attributes, "process.command")
          - delete_key(attributes, "process.executable.path")
          - delete_key(attributes, "process.executable.name")
          - delete_key(attributes, "process.owner")
          - delete_key(attributes, "host.name")
          - delete_key(attributes, "host.id")
      - context: span
        statements:
          # Gemini CLI names its operations llm_call, tool_call, agent_call,
          # schedule_tool_calls, and in interactive mode user_prompt (one turn,
          # the root of its model and tool spans) and system_prompt (the
          # follow-up turn that sends tool results back to the model). Map them
          # to the span kinds Future AGI uses.
          - set(attributes["gen_ai.span.kind"], "LLM") where attributes["gen_ai.operation.name"] == "llm_call"
          - set(attributes["gen_ai.span.kind"], "TOOL") where attributes["gen_ai.operation.name"] == "tool_call"
          - set(attributes["gen_ai.span.kind"], "AGENT") where attributes["gen_ai.operation.name"] == "agent_call"
          - set(attributes["gen_ai.span.kind"], "CHAIN") where attributes["gen_ai.operation.name"] == "schedule_tool_calls"
          - set(attributes["gen_ai.span.kind"], "CHAIN") where attributes["gen_ai.operation.name"] == "user_prompt"
          - set(attributes["gen_ai.span.kind"], "CHAIN") where attributes["gen_ai.operation.name"] == "system_prompt"
          # Name tool spans after the tool instead of "tool_call".
          - set(name, attributes["gen_ai.tool.name"]) where name == "tool_call" and attributes["gen_ai.tool.name"] != nil
          # Every span carries the Gemini CLI session id; as session.id it groups
          # the session's traces into one Future AGI session.
          - set(attributes["session.id"], attributes["gen_ai.conversation.id"]) where attributes["gen_ai.conversation.id"] != nil
          # Only present with the content opt-in (logPrompts: true): show the
          # messages as the span's input and output in Future AGI.
          - set(attributes["input.value"], attributes["gen_ai.input.messages"]) where attributes["gen_ai.input.messages"] != nil
          - set(attributes["output.value"], attributes["gen_ai.output.messages"]) where attributes["gen_ai.output.messages"] != nil
      - context: spanevent
        statements:
          # Gemini CLI records every error as an "exception" event. Its stack
          # trace lists file:// paths of your Gemini CLI install (home
          # directory, OS user name) and no content, so it is dropped even
          # with the content opt-in.
          - delete_key(attributes, "exception.stacktrace")

  # Privacy default. With logPrompts false Gemini CLI already leaves out the
  # message attributes; this also drops the system prompt (it embeds your
  # GEMINI.md memory), the tool schemas and error text. Remove this processor
  # from the pipeline below only to opt in to content.
  transform/strip-content:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "input.value")
          - delete_key(attributes, "output.value")
          - delete_key(attributes, "gen_ai.system_instructions")
          - delete_key(attributes, "gen_ai.tool.definitions")
          # The status message of a failed span is the raw error text: an API
          # error body, or for a tool that throws, file paths and command
          # output. Keep the ERROR status, replace the text (refined from the
          # exception event below).
          - set(status.message, "error") where status.code == STATUS_CODE_ERROR
          - set(status.message, "") where status.code != STATUS_CODE_ERROR
      - context: spanevent
        statements:
          # Status message = the error class or code (ApiError, ENOENT, ...),
          # plus the HTTP status for Gemini API errors ("ApiError HTTP 429").
          - set(span.status.message, attributes["exception.type"]) where name == "exception" and span.status.code == STATUS_CODE_ERROR and IsMatch(attributes["exception.type"], "^[A-Za-z0-9_.:-]{1,80}$")
          - set(span.status.message, Concat([attributes["exception.type"], ExtractPatterns(attributes["exception.message"], "\"code\\\\?\":\\s*(?P<code>[1-5][0-9][0-9])")["code"]], " HTTP ")) where name == "exception" and span.status.code == STATUS_CODE_ERROR and attributes["exception.type"] == "ApiError" and IsMatch(attributes["exception.message"], "\"code\\\\?\":\\s*[1-5][0-9][0-9]")
          - delete_key(attributes, "exception.type") where not IsMatch(attributes["exception.type"], "^[A-Za-z0-9_.:-]{1,80}$")
          - delete_key(attributes, "exception.message")

  batch:
    timeout: 2s

exporters:
  otlphttp/futureagi:
    traces_endpoint: ${env:FI_BASE_URL:-https://api.futureagi.com}/tracer/v1/traces
    # The Future AGI collector reads the request body as-is; the exporter's
    # default gzip encoding is answered with HTTP 400.
    compression: none
    headers:
      X-Api-Key: ${env:FI_API_KEY}
      X-Secret-Key: ${env:FI_SECRET_KEY}
  nop: {}

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/gemini-cli, transform/strip-content, batch]
      exporters: [otlphttp/futureagi]
    logs:
      receivers: [otlp]
      exporters: [nop]
    metrics:
      receivers: [otlp]
      exporters: [nop]
