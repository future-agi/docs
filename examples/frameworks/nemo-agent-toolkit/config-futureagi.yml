# NVIDIA NeMo Agent Toolkit calculator workflow traced to Future AGI.
# Same workflow as examples/observability/simple_calculator_observability/configs/config-futureagi.yml in the
# toolkit, with the model endpoint taken from the environment so any OpenAI-compatible endpoint can be used.
#
# Required: FI_API_KEY, FI_SECRET_KEY, LLM_API_KEY. Optional: FI_PROJECT_NAME, FI_BASE_URL, FI_GRPC_URL,
# FI_HIDE_INPUTS, FI_HIDE_OUTPUTS, LLM_BASE_URL, LLM_MODEL.

general:
  telemetry:
    logging:
      console:
        _type: console
        level: WARN
    tracing:
      futureagi:
        _type: futureagi
        project: ${FI_PROJECT_NAME:-nat-calculator}
        protocol: ${FI_PROTOCOL:-http}
        # Credentials are read from FI_API_KEY and FI_SECRET_KEY.

function_groups:
  calculator:
    _type: calculator

functions:
  current_datetime:
    _type: current_datetime

llms:
  nim_llm:
    _type: nim
    model_name: ${LLM_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
    base_url: ${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}
    api_key: ${LLM_API_KEY}
    temperature: 0.0
    max_tokens: 1024

workflow:
  _type: react_agent
  tool_names: [calculator, current_datetime]
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3
