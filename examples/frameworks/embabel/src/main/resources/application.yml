spring:
  application:
    name: embabel-weather-agent
  main:
    web-application-type: none

embabel:
  agent:
    platform:
      observability:
        enabled: true
        # Content OFF by default: no prompts, responses, tool arguments or results.
        # Set EMBABEL_CAPTURE_CONTENT=true to send them (error text follows the same switch).
        capture-message-content: ${EMBABEL_CAPTURE_CONTENT:false}
        trace-http-details: false

management:
  tracing:
    sampling:
      probability: 1.0   # Embabel's default too. Below 1.0, whole runs are dropped at random.
  opentelemetry:
    resource-attributes:
      project_name: ${FI_PROJECT_NAME}
      project_type: observe
    tracing:
      export:
        otlp:
          endpoint: ${FI_BASE_URL:https://api.futureagi.com}/tracer/v1/traces
          transport: http
          compression: none
          headers:
            X-Api-Key: ${FI_API_KEY}
            X-Secret-Key: ${FI_SECRET_KEY}
