<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="The replay loop: a production conversation recorded by Observe is replayed into a scenario and a recreated agent definition, rerun in simulation, then compared against the original before the fix ships back to production.">
  <defs>
    <marker id="replay-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaaaaa" />
    </marker>
  </defs>

  <!-- Four arcs on one circle: centre 400,350, radius 250 throughout, each a 55 degree
       clockwise sweep. Endpoints are angled so every arc clears its block by the same gap. -->
  <path d="M497.7,119.9 A250,250 0 0 1 644.5,298.0" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#replay-arrow)" />
  <path d="M644.5,402.0 A250,250 0 0 1 497.7,580.1" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#replay-arrow)" />
  <path d="M302.3,580.1 A250,250 0 0 1 155.5,402.0" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#replay-arrow)" />
  <path d="M155.5,298.0 A250,250 0 0 1 302.3,119.9" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#replay-arrow)" />

  <!-- Production, top -->
  <rect x="305" y="60" width="190" height="80" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.2" />
  <text x="400" y="90" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Production</text>
  <text x="400" y="110" text-anchor="middle" fill="#cccccc" font-size="11">a real customer talks to</text>
  <text x="400" y="125" text-anchor="middle" fill="#cccccc" font-size="11">the agent you shipped</text>

  <!-- Replay, right -->
  <rect x="555" y="310" width="190" height="80" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.2" />
  <text x="650" y="340" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Replay</text>
  <text x="650" y="360" text-anchor="middle" fill="#cccccc" font-size="11">the transcript becomes a scenario</text>
  <text x="650" y="375" text-anchor="middle" fill="#cccccc" font-size="11">and the config an agent definition</text>

  <!-- Simulation, bottom -->
  <rect x="305" y="560" width="190" height="80" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.2" />
  <text x="400" y="590" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Simulation</text>
  <text x="400" y="610" text-anchor="middle" fill="#cccccc" font-size="11">the simulator reruns it against</text>
  <text x="400" y="625" text-anchor="middle" fill="#cccccc" font-size="11">the recreated agent</text>

  <!-- Compare and fix, left -->
  <rect x="55" y="310" width="190" height="80" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.2" />
  <text x="150" y="340" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Compare and fix</text>
  <text x="150" y="360" text-anchor="middle" fill="#cccccc" font-size="11">measure against the original,</text>
  <text x="150" y="375" text-anchor="middle" fill="#cccccc" font-size="11">then ship the change</text>

  <text x="400" y="345" text-anchor="middle" fill="#7a7a7a" font-size="12" font-weight="700">The replay loop</text>
  <text x="400" y="365" text-anchor="middle" fill="#6a6a6a" font-size="11">the scenario stays as a regression test</text>
</svg>
