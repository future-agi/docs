<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Your agent holds a conversation with the FAGI simulator inside a simulated environment. A list of scenarios feeds the environment, and a list of personas feeds the scenarios.">
  <defs>
    <marker id="sim-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaaaaa" />
    </marker>
  </defs>

  <!-- Your agent -->
  <circle cx="120" cy="315" r="64" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="120" y="320" text-anchor="middle" fill="#ffffff" font-size="14">Your agent</text>

  <!-- conversation (label sits between the two arrows) -->
  <line x1="186" y1="299" x2="416" y2="299" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#sim-arrow)" />
  <line x1="416" y1="331" x2="188" y2="331" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#sim-arrow)" />
  <text x="301" y="320" text-anchor="middle" fill="#cccccc" font-size="12">conversation</text>

  <!-- Simulated environment -->
  <rect x="420" y="200" width="250" height="230" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="545" y="234" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Simulated environment</text>
  <text x="545" y="255" text-anchor="middle" font-size="13"><tspan fill="#8a8a8a">having a </tspan><tspan fill="#ffffff" font-weight="700">simulated scenario</tspan></text>
  <circle cx="545" cy="342" r="64" fill="#3a3a3a" stroke="#ffffff" stroke-width="1.5" />
  <text x="545" y="339" text-anchor="middle" fill="#ffffff" font-size="12">FAGI</text>
  <text x="545" y="355" text-anchor="middle" fill="#ffffff" font-size="12">Simulator</text>

  <!-- List of scenarios -->
  <rect x="820" y="70" width="240" height="180" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <line x1="820" y1="110" x2="1060" y2="110" stroke="#ffffff" stroke-width="1.5" />
  <line x1="820" y1="165" x2="1060" y2="165" stroke="#454545" stroke-width="1" />
  <line x1="820" y1="208" x2="1060" y2="208" stroke="#454545" stroke-width="1" />
  <text x="940" y="97" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">List of scenarios</text>
  <text x="940" y="142" text-anchor="middle" fill="#e5e5e5" font-size="13">Refund request</text>
  <text x="940" y="190" text-anchor="middle" fill="#e5e5e5" font-size="13">Booking change</text>
  <text x="940" y="234" text-anchor="middle" fill="#e5e5e5" font-size="16">⋮</text>

  <!-- List of personas -->
  <rect x="820" y="340" width="240" height="180" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <line x1="820" y1="380" x2="1060" y2="380" stroke="#ffffff" stroke-width="1.5" />
  <line x1="820" y1="435" x2="1060" y2="435" stroke="#454545" stroke-width="1" />
  <line x1="820" y1="478" x2="1060" y2="478" stroke="#454545" stroke-width="1" />
  <text x="940" y="367" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">List of personas</text>
  <text x="940" y="412" text-anchor="middle" fill="#f78b83" font-size="13">Frustrated customer</text>
  <text x="940" y="460" text-anchor="middle" fill="#96f783" font-size="13">Polite regular</text>
  <text x="940" y="504" text-anchor="middle" fill="#e5e5e5" font-size="16">⋮</text>

  <!-- scenarios feed the environment -->
  <line x1="818" y1="188" x2="672" y2="232" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#sim-arrow)" />

  <!-- personas feed the scenarios (label sits beside this vertical arrow) -->
  <line x1="900" y1="338" x2="900" y2="252" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#sim-arrow)" />
  <text x="968" y="284" text-anchor="middle" fill="#aaaaaa" font-size="11">Various personas</text>
  <text x="968" y="299" text-anchor="middle" fill="#aaaaaa" font-size="11">used to create</text>
  <text x="968" y="314" text-anchor="middle" fill="#aaaaaa" font-size="11">various scenarios</text>
</svg>
