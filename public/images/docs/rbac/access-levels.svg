<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" width="800" height="464" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Access has two levels. The organization holds members and roles, the plan and billing, and organization settings. Under it sit workspaces, and every workspace holds the same kinds of thing: traces, datasets, evaluations, prompts, annotation queues and knowledge bases.">
  <defs>
    <marker id="rbac-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaaaaa" />
    </marker>
  </defs>

  <!-- Organization band. Every body line is its own <text> rather than wrapped,
       so no label can spill past the rect. Heights are set so the bottom gap
       inside this band matches the one inside the workspace boxes. -->
  <rect x="40" y="20" width="720" height="134" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.2" />
  <text x="400" y="52" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Organization</text>
  <text x="400" y="78" text-anchor="middle" fill="#cccccc" font-size="11">members and roles</text>
  <text x="400" y="96" text-anchor="middle" fill="#cccccc" font-size="11">plan and billing</text>
  <text x="400" y="114" text-anchor="middle" fill="#cccccc" font-size="11">organization settings</text>

  <!-- One connector per workspace, all the same length -->
  <path d="M175,158 L175,206" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#rbac-arrow)" />
  <path d="M400,158 L400,206" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#rbac-arrow)" />
  <path d="M625,158 L625,206" fill="none" stroke="#aaaaaa" stroke-width="1.2" marker-end="url(#rbac-arrow)" />

  <!-- Row tag. Sits left of the leftmost connector (x=175) with 40px of clearance. -->
  <text x="75" y="200" text-anchor="start" fill="#7a7a7a" font-size="11" font-style="italic">Workspaces</text>

  <!-- Three workspaces. Equal boxes, identical contents, 25px between them.
       They hold the same kinds of thing; only the data inside differs. -->
  <rect x="75" y="214" width="200" height="160" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.2" />
  <text x="175" y="246" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Default workspace</text>
  <text x="175" y="274" text-anchor="middle" fill="#cccccc" font-size="11">traces</text>
  <text x="175" y="294" text-anchor="middle" fill="#cccccc" font-size="11">datasets and evaluations</text>
  <text x="175" y="314" text-anchor="middle" fill="#cccccc" font-size="11">prompts and queues</text>
  <text x="175" y="334" text-anchor="middle" fill="#cccccc" font-size="11">knowledge bases</text>

  <rect x="300" y="214" width="200" height="160" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.2" />
  <text x="400" y="246" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Team A workspace</text>
  <text x="400" y="274" text-anchor="middle" fill="#cccccc" font-size="11">traces</text>
  <text x="400" y="294" text-anchor="middle" fill="#cccccc" font-size="11">datasets and evaluations</text>
  <text x="400" y="314" text-anchor="middle" fill="#cccccc" font-size="11">prompts and queues</text>
  <text x="400" y="334" text-anchor="middle" fill="#cccccc" font-size="11">knowledge bases</text>

  <rect x="525" y="214" width="200" height="160" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.2" />
  <text x="625" y="246" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Team B workspace</text>
  <text x="625" y="274" text-anchor="middle" fill="#cccccc" font-size="11">traces</text>
  <text x="625" y="294" text-anchor="middle" fill="#cccccc" font-size="11">datasets and evaluations</text>
  <text x="625" y="314" text-anchor="middle" fill="#cccccc" font-size="11">prompts and queues</text>
  <text x="625" y="334" text-anchor="middle" fill="#cccccc" font-size="11">knowledge bases</text>

  <text x="400" y="414" text-anchor="middle" fill="#7a7a7a" font-size="12" font-weight="700">Where access lives</text>
  <text x="400" y="434" text-anchor="middle" fill="#6a6a6a" font-size="11">the organization is the billing boundary, the workspace is the data boundary</text>
</svg>
