<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 61 1100 438" width="1100" height="438" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Your agent, connected as a code repository, uploaded code, or an agent on a hosted platform, goes to the builder, which makes its environment: the contract, the world, and the scenarios. You then run it as often as you need: a run plays each scenario as a call, every call is graded as a pass, a fail, or not decided, Debug failures shows what failed so you can fix your agent, and you run again, each call starting from a clean world.">
  <defs>
    <marker id="envflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaaaaa" />
    </marker>
  </defs>

  <!-- Built from your agent -->
  <text x="262" y="196" text-anchor="middle" fill="#aaaaaa" font-size="13">Built from your agent</text>
  <line x1="24" y1="210" x2="500" y2="210" stroke="#454545" stroke-width="1.5" />

  <!-- Your agent -->
  <rect x="24" y="238" width="216" height="84" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="132" y="268" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Your agent</text>
  <text x="132" y="290" text-anchor="middle" fill="#cccccc" font-size="13">connected from a repository,</text>
  <text x="132" y="306" text-anchor="middle" fill="#cccccc" font-size="13">an upload, or a platform</text>

  <line x1="240" y1="280" x2="278" y2="280" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envflow-arrow)" />

  <!-- Environment -->
  <rect x="284" y="238" width="216" height="84" rx="14" fill="#3a3a3a" stroke="#ffffff" stroke-width="1.5" />
  <text x="392" y="268" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Environment</text>
  <text x="392" y="290" text-anchor="middle" fill="#cccccc" font-size="13">the builder makes its</text>
  <text x="392" y="306" text-anchor="middle" fill="#cccccc" font-size="13">contract, world, scenarios</text>

  <line x1="500" y1="280" x2="549" y2="280" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envflow-arrow)" />

  <!-- The loop: three arcs on one circle, centre 820,280, radius 170 -->
  <path d="M657.3,230.9 A170,170 0 0 1 802.8,110.9" fill="none" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envflow-arrow)" />
  <path d="M958.9,182.0 A170,170 0 0 1 958.9,378.0" fill="none" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envflow-arrow)" />
  <path d="M802.8,449.1 A170,170 0 0 1 657.3,329.1" fill="none" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envflow-arrow)" />
  <text x="1002" y="284" text-anchor="start" fill="#aaaaaa" font-size="13" font-style="italic">a call fails</text>
  <text x="690" y="436" text-anchor="end" fill="#aaaaaa" font-size="13" font-style="italic">run again</text>

  <!-- Run -->
  <rect x="555" y="238" width="190" height="84" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="650" y="268" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Run</text>
  <text x="650" y="290" text-anchor="middle" fill="#cccccc" font-size="13">plays each scenario</text>
  <text x="650" y="306" text-anchor="middle" fill="#cccccc" font-size="13">as a call</text>

  <!-- Graded calls -->
  <rect x="810" y="91" width="190" height="84" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="905" y="121" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Graded calls</text>
  <text x="905" y="143" text-anchor="middle" fill="#cccccc" font-size="13">every call is graded:</text>
  <text x="905" y="159" text-anchor="middle" font-size="13"><tspan fill="#96f783">pass</tspan><tspan fill="#cccccc">, </tspan><tspan fill="#f78b83">fail</tspan><tspan fill="#cccccc"> or </tspan><tspan fill="#ffffff">not decided</tspan></text>

  <!-- Fix your agent -->
  <rect x="810" y="385" width="190" height="84" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="905" y="415" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Debug failures</text>
  <text x="905" y="437" text-anchor="middle" fill="#cccccc" font-size="13">see what failed, then</text>
  <text x="905" y="453" text-anchor="middle" fill="#cccccc" font-size="13">fix your agent</text>

  <!-- Loop centre -->
  <text x="866" y="274" text-anchor="middle" fill="#aaaaaa" font-size="13" font-weight="700">Run as often as you need</text>
  <text x="866" y="294" text-anchor="middle" fill="#8a8a8a" font-size="13">each call starts from a clean world</text>
</svg>
