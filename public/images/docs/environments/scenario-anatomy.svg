<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="One scenario holds a situation (your driver is twenty minutes late and you want to cancel), a persona (an impatient rider who shares their booking ID only when asked), a starting state (a ride that's already running late is added to the world), its sub-goals (the ride is cancelled in the world, and the agent confirms the cancellation), and its ideal outcome, one line saying what a pass looks like (passes when the ride is cancelled and the caller hears it confirmed). A run plays the scenario as several calls set by Repeats, here five: four pass and one fails. Each call is decided by its sub-goals, checked against the world after the call or the conversation, read by a model: the call passes when every sub-goal holds, fails when any one doesn't, and is not decided when a sub-goal can't be settled.">
  <defs>
    <marker id="anatomy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaaaaa" />
    </marker>
  </defs>

  <!-- One scenario -->
  <rect x="40" y="30" width="430" height="480" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="255" y="64" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">One scenario</text>
  <line x1="40" y1="82" x2="470" y2="82" stroke="#ffffff" stroke-width="1.5" />

  <text x="64" y="108" fill="#ffffff" font-size="13" font-weight="700">Situation</text>
  <text x="64" y="130" fill="#cccccc" font-size="13">"Your driver is twenty minutes late and you want to cancel"</text>
  <line x1="40" y1="148" x2="470" y2="148" stroke="#454545" stroke-width="1" />

  <text x="64" y="174" fill="#ffffff" font-size="13" font-weight="700">Persona</text>
  <text x="64" y="196" fill="#cccccc" font-size="13">an impatient rider who shares their booking ID only when asked</text>
  <line x1="40" y1="214" x2="470" y2="214" stroke="#454545" stroke-width="1" />

  <text x="64" y="240" fill="#ffffff" font-size="13" font-weight="700">Starting state</text>
  <text x="64" y="262" fill="#cccccc" font-size="13">a ride that's already running late is added to the world</text>
  <line x1="40" y1="280" x2="470" y2="280" stroke="#454545" stroke-width="1" />

  <text x="64" y="306" fill="#ffffff" font-size="13" font-weight="700">Sub-goals</text>
  <rect x="64" y="320" width="382" height="44" rx="10" fill="#3a3a3a" stroke="#aaaaaa" stroke-width="1" />
  <text x="82" y="347" fill="#e5e5e5" font-size="13">The ride is cancelled in the world</text>
  <rect x="64" y="388" width="382" height="44" rx="10" fill="#3a3a3a" stroke="#aaaaaa" stroke-width="1" />
  <text x="82" y="415" fill="#e5e5e5" font-size="13">The agent confirms the cancellation</text>
  <line x1="40" y1="446" x2="470" y2="446" stroke="#454545" stroke-width="1" />
  <text x="64" y="472" fill="#ffffff" font-size="13" font-weight="700">Ideal outcome</text>
  <text x="64" y="494" fill="#cccccc" font-size="13">Passes when the ride is cancelled and the caller hears it confirmed</text>

  <!-- Repeats -->
  <line x1="474" y1="140" x2="556" y2="140" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#anatomy-arrow)" />
  <text x="515" y="112" text-anchor="middle" fill="#cccccc" font-size="13">played</text>
  <text x="515" y="128" text-anchor="middle" fill="#cccccc" font-size="13">in a run</text>
  <rect x="560" y="30" width="500" height="200" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="810" y="64" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Repeats</text>
  <text x="810" y="86" text-anchor="middle" fill="#cccccc" font-size="13">the same scenario played as several calls, here 5</text>
  <circle cx="650" cy="140" r="30" fill="#3a3a3a" stroke="#96f783" stroke-width="1.5" />
  <text x="650" y="144" text-anchor="middle" fill="#96f783" font-size="13">pass</text>
  <circle cx="730" cy="140" r="30" fill="#3a3a3a" stroke="#96f783" stroke-width="1.5" />
  <text x="730" y="144" text-anchor="middle" fill="#96f783" font-size="13">pass</text>
  <circle cx="810" cy="140" r="30" fill="#3a3a3a" stroke="#f78b83" stroke-width="1.5" />
  <text x="810" y="144" text-anchor="middle" fill="#f78b83" font-size="13">fail</text>
  <circle cx="890" cy="140" r="30" fill="#3a3a3a" stroke="#96f783" stroke-width="1.5" />
  <text x="890" y="144" text-anchor="middle" fill="#96f783" font-size="13">pass</text>
  <circle cx="970" cy="140" r="30" fill="#3a3a3a" stroke="#96f783" stroke-width="1.5" />
  <text x="970" y="144" text-anchor="middle" fill="#96f783" font-size="13">pass</text>
  <text x="810" y="204" text-anchor="middle" fill="#8a8a8a" font-size="13">several calls show whether it holds every time</text>

  <!-- How each call is decided -->
  <text x="810" y="268" text-anchor="middle" fill="#aaaaaa" font-size="13" font-weight="700">Each call is decided by its sub-goals</text>

  <line x1="446" y1="342" x2="556" y2="342" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#anatomy-arrow)" />
  <line x1="446" y1="410" x2="556" y2="410" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#anatomy-arrow)" />
  <text x="503" y="372" text-anchor="middle" fill="#cccccc" font-size="13">checked</text>
  <text x="503" y="388" text-anchor="middle" fill="#cccccc" font-size="13">against</text>

  <rect x="560" y="316" width="200" height="52" rx="12" fill="#3a3a3a" stroke="#aaaaaa" stroke-width="1.5" />
  <text x="660" y="337" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">World</text>
  <text x="660" y="356" text-anchor="middle" fill="#cccccc" font-size="13">after the call</text>

  <rect x="560" y="384" width="200" height="52" rx="12" fill="#3a3a3a" stroke="#aaaaaa" stroke-width="1.5" />
  <text x="660" y="405" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Conversation</text>
  <text x="660" y="424" text-anchor="middle" fill="#cccccc" font-size="13">read by a model</text>

  <line x1="760" y1="342" x2="834" y2="372" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#anatomy-arrow)" />
  <line x1="760" y1="410" x2="834" y2="400" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#anatomy-arrow)" />

  <!-- Call result -->
  <rect x="840" y="290" width="220" height="200" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="950" y="318" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">The call</text>
  <line x1="840" y1="332" x2="1060" y2="332" stroke="#ffffff" stroke-width="1.5" />
  <text x="950" y="354" text-anchor="middle" fill="#96f783" font-size="13" font-weight="700">Pass</text>
  <text x="950" y="372" text-anchor="middle" fill="#cccccc" font-size="13">every sub-goal holds</text>
  <line x1="840" y1="384" x2="1060" y2="384" stroke="#454545" stroke-width="1" />
  <text x="950" y="406" text-anchor="middle" fill="#f78b83" font-size="13" font-weight="700">Fail</text>
  <text x="950" y="424" text-anchor="middle" fill="#cccccc" font-size="13">any one doesn't</text>
  <line x1="840" y1="436" x2="1060" y2="436" stroke="#454545" stroke-width="1" />
  <text x="950" y="458" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Not decided</text>
  <text x="950" y="476" text-anchor="middle" fill="#cccccc" font-size="13">a sub-goal can't be settled</text>
</svg>
