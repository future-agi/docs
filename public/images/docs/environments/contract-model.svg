<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Your agent's source or platform configuration is read once into a contract listing its tools, rules, use cases, channel, data and end conditions. The contract then defines three things: the world of seeded data the tools act on, the scenarios, and the grading.">
  <defs>
    <marker id="env-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaaaaa" />
    </marker>
  </defs>

  <!-- Your agent -->
  <circle cx="120" cy="280" r="64" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="120" y="285" text-anchor="middle" fill="#ffffff" font-size="14">Your agent</text>
  <text x="120" y="372" text-anchor="middle" fill="#aaaaaa" font-size="11">source code, or its</text>
  <text x="120" y="387" text-anchor="middle" fill="#aaaaaa" font-size="11">hosted platform config</text>

  <!-- read -->
  <line x1="186" y1="280" x2="306" y2="280" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#env-arrow)" />
  <text x="246" y="268" text-anchor="middle" fill="#cccccc" font-size="12">read once,</text>
  <text x="246" y="300" text-anchor="middle" fill="#cccccc" font-size="12">at build</text>

  <!-- Contract -->
  <rect x="310" y="60" width="300" height="440" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="460" y="97" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Contract</text>
  <text x="460" y="117" text-anchor="middle" fill="#8a8a8a" font-size="12">only what was found, never guessed</text>
  <line x1="310" y1="135" x2="610" y2="135" stroke="#ffffff" stroke-width="1.5" />
  <text x="460" y="170" text-anchor="middle" fill="#e5e5e5" font-size="13">Tools and their arguments</text>
  <line x1="310" y1="192" x2="610" y2="192" stroke="#454545" stroke-width="1" />
  <text x="460" y="226" text-anchor="middle" fill="#e5e5e5" font-size="13">Rules it must hold</text>
  <line x1="310" y1="248" x2="610" y2="248" stroke="#454545" stroke-width="1" />
  <text x="460" y="282" text-anchor="middle" fill="#e5e5e5" font-size="13">Real use cases</text>
  <line x1="310" y1="304" x2="610" y2="304" stroke="#454545" stroke-width="1" />
  <text x="460" y="338" text-anchor="middle" fill="#e5e5e5" font-size="13">Voice or chat, inbound or outbound</text>
  <line x1="310" y1="360" x2="610" y2="360" stroke="#454545" stroke-width="1" />
  <text x="460" y="394" text-anchor="middle" fill="#e5e5e5" font-size="13">The data its tools act on</text>
  <line x1="310" y1="416" x2="610" y2="416" stroke="#454545" stroke-width="1" />
  <text x="460" y="450" text-anchor="middle" fill="#e5e5e5" font-size="13">How a run ends</text>

  <!-- defines -->
  <line x1="614" y1="200" x2="756" y2="126" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#env-arrow)" />
  <line x1="614" y1="280" x2="756" y2="280" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#env-arrow)" />
  <line x1="614" y1="360" x2="756" y2="434" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#env-arrow)" />
  <text x="690" y="262" text-anchor="middle" fill="#cccccc" font-size="12">defines</text>

  <!-- World -->
  <rect x="760" y="70" width="300" height="112" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="910" y="114" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">World</text>
  <text x="910" y="140" text-anchor="middle" fill="#e5e5e5" font-size="13">seeded data the tools act on,</text>
  <text x="910" y="160" text-anchor="middle" fill="#e5e5e5" font-size="13">a clean copy for every scenario</text>

  <!-- Scenarios -->
  <rect x="760" y="224" width="300" height="112" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="910" y="268" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Scenarios</text>
  <text x="910" y="294" text-anchor="middle" fill="#e5e5e5" font-size="13">one task each, written from</text>
  <text x="910" y="314" text-anchor="middle" fill="#e5e5e5" font-size="13">a real use case</text>

  <!-- Grading -->
  <rect x="760" y="378" width="300" height="112" rx="14" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="910" y="422" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Grading</text>
  <text x="910" y="448" text-anchor="middle" fill="#e5e5e5" font-size="13">sub-goals per scenario, plus</text>
  <text x="910" y="468" text-anchor="middle" fill="#e5e5e5" font-size="13">evaluations from the library</text>
</svg>
