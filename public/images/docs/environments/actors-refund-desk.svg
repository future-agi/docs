<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="In a refund desk scenario, numbered as in the steps: the caller asks your agent for a refund and the caller's partner, an actor on the caller's side, joins the chat. Your agent requests the refund in the world. A coworker in the world tries to approve it and is refused, because approving isn't one of its actions. The store manager, an actor in the world allowed to approve, approves it.">
  <defs>
    <marker id="act-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaaaaa" />
    </marker>
    <marker id="act-arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f78b83" />
    </marker>
    <marker id="act-arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#96f783" />
    </marker>
  </defs>

  <!-- section labels -->
  <text x="300" y="58" text-anchor="middle" fill="#8a8a8a" font-size="12" letter-spacing="1">IN THE CONVERSATION</text>
  <text x="800" y="58" text-anchor="middle" fill="#8a8a8a" font-size="12" letter-spacing="1">IN THE WORLD</text>

  <!-- Caller -->
  <rect x="40" y="110" width="200" height="90" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="140" y="150" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Caller</text>
  <text x="140" y="172" text-anchor="middle" fill="#cccccc" font-size="12">the simulated customer</text>

  <!-- Partner -->
  <rect x="40" y="280" width="200" height="90" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="140" y="318" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Caller's partner</text>
  <text x="140" y="340" text-anchor="middle" fill="#cccccc" font-size="12">caller's side, speaks</text>

  <!-- Agent -->
  <rect x="360" y="110" width="160" height="260" rx="16" fill="#3a3a3a" stroke="#ffffff" stroke-width="1.5" />
  <text x="440" y="235" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Your agent</text>
  <text x="440" y="257" text-anchor="middle" fill="#cccccc" font-size="12">the refund desk</text>

  <!-- caller -> agent -->
  <line x1="240" y1="155" x2="356" y2="155" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#act-arrow)" />
  <text x="298" y="143" text-anchor="middle" fill="#cccccc" font-size="12">asks for a refund</text>

  <!-- partner -> agent -->
  <line x1="240" y1="325" x2="356" y2="325" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#act-arrow)" />
  <text x="298" y="313" text-anchor="middle" fill="#cccccc" font-size="12">joins the chat</text>

  <!-- World -->
  <rect x="580" y="110" width="160" height="260" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="660" y="225" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">The world</text>
  <text x="660" y="247" text-anchor="middle" fill="#cccccc" font-size="12">orders and refunds,</text>
  <text x="660" y="265" text-anchor="middle" fill="#cccccc" font-size="12">every attempt recorded</text>

  <!-- agent -> world -->
  <line x1="520" y1="240" x2="576" y2="240" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#act-arrow)" />
  <text x="550" y="228" text-anchor="middle" fill="#cccccc" font-size="12">requests</text>

  <!-- Coworker -->
  <rect x="860" y="110" width="200" height="90" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="960" y="150" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Coworker</text>
  <text x="960" y="172" text-anchor="middle" fill="#cccccc" font-size="12">in the world, may not approve</text>

  <!-- Manager -->
  <rect x="860" y="280" width="200" height="90" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="960" y="318" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Store manager</text>
  <text x="960" y="340" text-anchor="middle" fill="#cccccc" font-size="12">in the world, may approve</text>

  <!-- coworker -> world (refused) -->
  <line x1="860" y1="155" x2="744" y2="155" stroke="#f78b83" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#act-arrow-red)" />
  <text x="802" y="143" text-anchor="middle" fill="#f78b83" font-size="12">approve: refused</text>

  <!-- manager -> world (approved) -->
  <line x1="860" y1="325" x2="744" y2="325" stroke="#96f783" stroke-width="1.5" marker-end="url(#act-arrow-green)" />
  <text x="802" y="313" text-anchor="middle" fill="#96f783" font-size="12">approves</text>

  <circle cx="298" cy="345" r="11" fill="#ffffff" />
  <text x="298" y="349" text-anchor="middle" fill="#141414" font-size="12" font-weight="700">1</text>
  <circle cx="550" cy="265" r="11" fill="#ffffff" />
  <text x="550" y="269" text-anchor="middle" fill="#141414" font-size="12" font-weight="700">2</text>
  <circle cx="802" cy="180" r="11" fill="#ffffff" />
  <text x="802" y="184" text-anchor="middle" fill="#141414" font-size="12" font-weight="700">3</text>
  <circle cx="802" cy="350" r="11" fill="#ffffff" />
  <text x="802" y="354" text-anchor="middle" fill="#141414" font-size="12" font-weight="700">4</text>
  <!-- footer -->
  <text x="550" y="450" text-anchor="middle" fill="#aaaaaa" font-size="12">Each actor knows only its own facts and may take only the actions it was given. The world refuses the rest and records it</text>
</svg>
