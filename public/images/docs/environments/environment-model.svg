<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Your agent and a simulated caller sit outside the environment and talk to each other in a call. The environment holds four things: the contract, which records what your agent is for, the tools it calls, the rules it keeps, and the use cases it handles; the scenarios, each starting from a clean copy of the world, one of which the simulated caller plays; your agent's tools, which your agent calls; and the world, a test version of your agent's data that the tools read and change. An agent hosted on a platform gets no world.">
  <defs>
    <marker id="envmodel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaaaaa" />
    </marker>
  </defs>

  <!-- Simulated caller -->
  <circle cx="150" cy="246" r="62" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="150" y="243" text-anchor="middle" fill="#ffffff" font-size="14">Simulated</text>
  <text x="150" y="261" text-anchor="middle" fill="#ffffff" font-size="14">caller</text>

  <!-- Your agent -->
  <circle cx="150" cy="426" r="62" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="150" y="431" text-anchor="middle" fill="#ffffff" font-size="14">Your agent</text>

  <!-- conversation between them -->
  <line x1="138" y1="312" x2="138" y2="358" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envmodel-arrow)" />
  <line x1="162" y1="360" x2="162" y2="314" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envmodel-arrow)" />
  <text x="124" y="332" text-anchor="end" fill="#cccccc" font-size="13">talk in</text>
  <text x="124" y="348" text-anchor="end" fill="#cccccc" font-size="13">a call</text>

  <!-- Environment -->
  <rect x="360" y="30" width="710" height="500" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="715" y="64" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Environment</text>

  <!-- Contract -->
  <rect x="390" y="84" width="650" height="68" rx="12" fill="#3a3a3a" stroke="#aaaaaa" stroke-width="1.5" />
  <text x="715" y="112" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Contract</text>
  <text x="715" y="134" text-anchor="middle" fill="#cccccc" font-size="13">what your agent is for, the tools it calls, the rules it keeps, and the use cases it handles</text>

  <!-- Scenarios -->
  <rect x="390" y="176" width="650" height="140" rx="12" fill="#3a3a3a" stroke="#aaaaaa" stroke-width="1.5" />
  <text x="715" y="204" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Scenarios</text>
  <text x="715" y="224" text-anchor="middle" fill="#cccccc" font-size="13">each one starts from a clean copy of the world</text>
  <rect x="414" y="240" width="190" height="56" rx="10" fill="#454545" stroke="#aaaaaa" stroke-width="1" />
  <text x="509" y="263" text-anchor="middle" fill="#e5e5e5" font-size="13">Driver is late and the</text>
  <text x="509" y="280" text-anchor="middle" fill="#e5e5e5" font-size="13">caller wants to cancel</text>
  <rect x="620" y="240" width="190" height="56" rx="10" fill="#454545" stroke="#aaaaaa" stroke-width="1" />
  <text x="715" y="263" text-anchor="middle" fill="#e5e5e5" font-size="13">Caller tries to skip</text>
  <text x="715" y="280" text-anchor="middle" fill="#e5e5e5" font-size="13">the code check</text>
  <rect x="826" y="240" width="190" height="56" rx="10" fill="#454545" stroke="#aaaaaa" stroke-width="1" />
  <text x="921" y="273" text-anchor="middle" fill="#e5e5e5" font-size="16">⋯</text>

  <!-- Tools -->
  <rect x="390" y="356" width="250" height="140" rx="12" fill="#3a3a3a" stroke="#aaaaaa" stroke-width="1.5" />
  <text x="515" y="400" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Tools</text>
  <text x="515" y="424" text-anchor="middle" fill="#cccccc" font-size="13">your agent's own actions,</text>
  <text x="515" y="441" text-anchor="middle" fill="#cccccc" font-size="13">like cancel a ride</text>

  <!-- Tools act on the world -->
  <line x1="640" y1="426" x2="784" y2="426" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envmodel-arrow)" />
  <text x="712" y="414" text-anchor="middle" fill="#cccccc" font-size="13">read and change</text>

  <!-- World -->
  <rect x="790" y="356" width="250" height="140" rx="12" fill="#3a3a3a" stroke="#aaaaaa" stroke-width="1.5" />
  <text x="915" y="400" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">World</text>
  <text x="915" y="424" text-anchor="middle" fill="#cccccc" font-size="13">a test version of your agent's</text>
  <text x="915" y="441" text-anchor="middle" fill="#cccccc" font-size="13">data, never your live data</text>
  <text x="915" y="472" text-anchor="middle" fill="#8a8a8a" font-size="12">none for an agent hosted on a platform</text>

  <!-- links from outside -->
  <line x1="384" y1="246" x2="216" y2="246" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envmodel-arrow)" />
  <text x="288" y="234" text-anchor="middle" fill="#cccccc" font-size="13">plays one scenario</text>
  <line x1="216" y1="426" x2="384" y2="426" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#envmodel-arrow)" />
  <text x="288" y="414" text-anchor="middle" fill="#cccccc" font-size="13">calls</text>
</svg>
