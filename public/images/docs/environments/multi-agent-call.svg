<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="In a call to a multi-agent app, the simulated caller talks only to the coordinator. The coordinator hands a task to one participant at a time and gets its result back. Each participant acts in the world on its own deadline, and each can have its own participant checks.">
  <defs>
    <marker id="ma-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aaaaaa" />
    </marker>
  </defs>

  <!-- Caller -->
  <rect x="40" y="185" width="180" height="90" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="130" y="225" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Caller</text>
  <text x="130" y="247" text-anchor="middle" fill="#cccccc" font-size="12">the simulated customer</text>

  <!-- caller <-> coordinator -->
  <line x1="224" y1="230" x2="316" y2="230" stroke="#aaaaaa" stroke-width="1.5" marker-start="url(#ma-arrow)" marker-end="url(#ma-arrow)" />
  <text x="270" y="218" text-anchor="middle" fill="#cccccc" font-size="12">talks with</text>

  <!-- Coordinator -->
  <rect x="320" y="70" width="180" height="320" rx="16" fill="#3a3a3a" stroke="#ffffff" stroke-width="1.5" />
  <text x="410" y="222" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Coordinator</text>
  <text x="410" y="244" text-anchor="middle" fill="#cccccc" font-size="12">the agent the</text>
  <text x="410" y="260" text-anchor="middle" fill="#cccccc" font-size="12">caller talks to</text>

  <!-- Participant A -->
  <rect x="620" y="70" width="210" height="110" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="725" y="112" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Pre-trip participant</text>
  <text x="725" y="134" text-anchor="middle" fill="#cccccc" font-size="12">own deadline,</text>
  <text x="725" y="150" text-anchor="middle" fill="#cccccc" font-size="12">own participant checks</text>

  <!-- Participant B -->
  <rect x="620" y="280" width="210" height="110" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="725" y="322" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Booking participant</text>
  <text x="725" y="344" text-anchor="middle" fill="#cccccc" font-size="12">own deadline,</text>
  <text x="725" y="360" text-anchor="middle" fill="#cccccc" font-size="12">own participant checks</text>

  <!-- coordinator <-> participant A -->
  <line x1="500" y1="105" x2="616" y2="105" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#ma-arrow)" />
  <text x="558" y="95" text-anchor="middle" fill="#cccccc" font-size="12">task</text>
  <line x1="620" y1="150" x2="504" y2="150" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ma-arrow)" />
  <text x="558" y="170" text-anchor="middle" fill="#cccccc" font-size="12">result</text>

  <!-- coordinator <-> participant B -->
  <line x1="500" y1="315" x2="616" y2="315" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#ma-arrow)" />
  <text x="558" y="305" text-anchor="middle" fill="#cccccc" font-size="12">task</text>
  <line x1="620" y1="360" x2="504" y2="360" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ma-arrow)" />
  <text x="558" y="380" text-anchor="middle" fill="#cccccc" font-size="12">result</text>

  <!-- World -->
  <rect x="920" y="70" width="150" height="320" rx="16" fill="#2f2f2f" stroke="#ffffff" stroke-width="1.5" />
  <text x="995" y="222" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">The world</text>
  <text x="995" y="244" text-anchor="middle" fill="#cccccc" font-size="12">the app's test data</text>

  <!-- participants -> world -->
  <line x1="830" y1="125" x2="916" y2="125" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#ma-arrow)" />
  <text x="873" y="115" text-anchor="middle" fill="#cccccc" font-size="12">acts</text>
  <line x1="830" y1="335" x2="916" y2="335" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#ma-arrow)" />
  <text x="873" y="325" text-anchor="middle" fill="#cccccc" font-size="12">acts</text>

  <!-- footer -->
  <text x="550" y="450" text-anchor="middle" fill="#aaaaaa" font-size="12">The coordinator hands work to one participant at a time, one level deep. Each participant can be graded on its own part of the call</text>
</svg>
