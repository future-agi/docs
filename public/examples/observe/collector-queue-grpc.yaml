extensions:
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true
    fsync: true
    timeout: 10s
    max_size: 8589934592
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318
        max_request_body_size: 16777216
      grpc:
        endpoint: 127.0.0.1:14317
        max_recv_msg_size_mib: 16
exporters:
  otlp/futureagi:
    endpoint: ${env:FI_OTLP_GRPC_ENDPOINT}
    tls:
      insecure: ${env:FI_OTLP_GRPC_INSECURE:-false}
    compression: none
    timeout: 10s
    headers:
      x-api-key: ${env:FI_API_KEY}
      x-secret-key: ${env:FI_SECRET_KEY}
      x-project-name: ${env:FI_PROJECT_NAME}
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 2147483648
      num_consumers: 2
      storage: file_storage/queue
      block_on_overflow: false
      wait_for_result: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 0s
service:
  extensions: [file_storage/queue]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 18888
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/futureagi]
